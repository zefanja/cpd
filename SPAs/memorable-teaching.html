<!-- Selbstlern-Modul: Memorable Teaching (Peps McCrea) – 9 Prinzipien -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memorable Teaching · 9 Prinzipien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --paper:#f4efe6; --paper2:#ece4d6; --card:#fbf8f1; --ink:#221f1a; --muted:#6f665a;
    --line:#dbd1bf;
    --wm:#2f8a5b;        /* Arbeitsgedächtnis / Denken */
    --ltm:#6a51c4;       /* Langzeitgedächtnis / Wissen */
    --harness:#2f8a5b; --direct:#6a51c4; --amplify:#bc6a2a;
    --correct:#2f7d52; --correct-bg:#e6f1e8;
    --wrong:#b1462c; --wrong-bg:#f6e6e0;
    --accent:#bc6a2a;
    --shadow:0 1px 0 #fff inset, 0 10px 30px -18px rgba(40,32,20,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif; line-height:1.62;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 16% 0%, rgba(106,81,196,.05), transparent 45%),
      radial-gradient(circle at 92% 6%, rgba(47,138,91,.05), transparent 42%);
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:26px 20px 90px}

  /* Kopf */
  header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .kicker{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .title{font-family:"Fraunces",serif;font-weight:600;font-size:1.05rem;color:var(--ink)}
  .title b{color:var(--accent)}

  /* Fortschritt + Ebenen-Spine */
  .meter{margin:14px 0 8px}
  .bar{height:7px;background:var(--paper2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--harness),var(--direct),var(--amplify));transition:width .5s cubic-bezier(.4,1.1,.4,1)}
  .meter small{display:block;margin-top:7px;color:var(--muted);font-size:.8rem}

  .spine{display:flex;gap:6px;margin:4px 0 22px;flex-wrap:wrap}
  .spine .seg{flex:1;min-width:120px;border:1px solid var(--line);border-radius:11px;background:var(--card);padding:8px 10px;opacity:.55;transition:.35s}
  .spine .seg.active{opacity:1;box-shadow:var(--shadow)}
  .spine .seg .lab{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  .spine .seg .sub{font-size:.74rem;color:var(--muted);margin-top:2px}
  .spine .h .lab{color:var(--harness)} .spine .d .lab{color:var(--direct)} .spine .a .lab{color:var(--amplify)}

  /* Karte */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:28px 30px 26px;box-shadow:var(--shadow);animation:rise .4s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .eyebrow .pill{font-family:"Hanken Grotesk";font-size:.62rem;letter-spacing:.1em;padding:2px 8px;border-radius:99px;color:#fff}
  .pill.h{background:var(--harness)} .pill.d{background:var(--direct)} .pill.a{background:var(--amplify)}
  h2{font-family:"Fraunces",serif;font-weight:600;font-size:1.62rem;line-height:1.15;margin:.1rem 0 .7rem}
  h3{font-family:"Fraunces",serif;font-weight:600;font-size:1.04rem;margin:1.1rem 0 .3rem}
  p{margin:.55rem 0}
  .lead{font-size:1.06rem}
  .quote{border-left:3px solid var(--accent);padding:.1rem 0 .1rem .9rem;margin:.9rem 0;color:var(--muted);font-style:italic;font-family:"Fraunces",serif}
  .quote span{display:block;font-style:normal;font-size:.8rem;letter-spacing:.04em;margin-top:.25rem;color:var(--muted)}
  ul.clean{margin:.5rem 0;padding-left:1.1rem}
  ul.clean li{margin:.3rem 0}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:.7rem 0}
  @media(max-width:560px){.twocol{grid-template-columns:1fr}}
  .mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
  .mini b{font-family:"Fraunces",serif}
  .tag-wm{color:var(--wm);font-weight:700}
  .tag-ltm{color:var(--ltm);font-weight:700}

  figure{margin:1rem 0;text-align:center}
  figure svg{max-width:100%;height:auto}
  figcaption{font-size:.78rem;color:var(--muted);margin-top:.4rem}

  /* Fragen */
  .qmeta{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
  .qtext{font-family:"Fraunces",serif;font-weight:600;font-size:1.22rem;line-height:1.25;margin:.1rem 0 .9rem}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:12px 14px;margin:8px 0;font:inherit;color:var(--ink);cursor:pointer;transition:.18s;position:relative}
  .opt:hover{border-color:#c7bca6}
  .opt:focus-visible{outline:3px solid rgba(188,106,42,.45);outline-offset:2px}
  .opt.is-correct{border-color:var(--correct);background:var(--correct-bg)}
  .opt.is-wrong{border-color:var(--wrong);background:var(--wrong-bg)}
  .opt .fb{display:none;margin-top:7px;font-size:.9rem;color:var(--muted)}
  .opt.show-fb .fb{display:block}
  .opt .mark{position:absolute;right:12px;top:11px;font-weight:700}
  .opt.is-correct .mark{color:var(--correct)} .opt.is-wrong .mark{color:var(--wrong)}

  /* True/False */
  .tf{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;margin:8px 0}
  .tf .stmt{font-weight:500}
  .tf .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .tf button{font:inherit;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 16px;cursor:pointer}
  .tf button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
  .tf.done.ok{border-color:var(--correct);background:var(--correct-bg)}
  .tf.done.no{border-color:var(--wrong);background:var(--wrong-bg)}
  .tf .fb{display:none;margin-top:8px;font-size:.88rem;color:var(--muted)}
  .tf.done .fb{display:block}

  /* Order */
  .order li{list-style:none;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0}
  .order ul{padding:0;margin:.4rem 0}
  .order .ctrls{margin-left:auto;display:flex;gap:4px}
  .order .ctrls button{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1rem;line-height:1}
  .order li.ok{border-color:var(--correct);background:var(--correct-bg)}
  .order li.no{border-color:var(--wrong);background:var(--wrong-bg)}

  /* Match */
  .match .pair{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0}
  .match .left{font-weight:600}
  .match select{font:inherit;padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);max-width:230px}
  .match .pair.ok{border-color:var(--correct);background:var(--correct-bg)}
  .match .pair.no{border-color:var(--wrong);background:var(--wrong-bg)}

  .feedback{margin-top:10px;font-size:.92rem;padding:10px 12px;border-radius:10px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--correct-bg);color:var(--correct)}
  .feedback.no{background:var(--wrong-bg);color:var(--wrong)}

  .actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:600;border:none;border-radius:11px;padding:11px 22px;cursor:pointer;transition:.18s}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px -10px rgba(188,106,42,.8)}
  .btn.primary:disabled{background:#d8c8b2;color:#fff;cursor:not-allowed;box-shadow:none}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
  .btn:focus-visible{outline:3px solid rgba(188,106,42,.45);outline-offset:2px}
  .hint{font-size:.82rem;color:var(--muted)}

  /* Bericht */
  .report .scorebig{font-family:"Fraunces",serif;font-size:2.6rem;font-weight:600;line-height:1}
  .report .grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
  .report .item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 12px}
  .report .item .ic{font-weight:700}
  .report .item .ic.g{color:var(--correct)} .report .item .ic.y{color:var(--accent)}
  .report .item small{color:var(--muted)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <span class="kicker">Selbstlern-Modul</span>
    <span class="title">Memorable&nbsp;Teaching · die <b>9 Prinzipien</b> nach Peps McCrea</span>
  </header>

  <div class="meter">
    <div class="bar"><i id="barfill"></i></div>
    <small id="barlabel">Schritt 1</small>
  </div>

  <div class="spine" id="spine">
    <div class="seg h" data-layer="intro"><div class="lab">Grundlagen</div><div class="sub">Architektur des Gedächtnisses</div></div>
    <div class="seg h" data-layer="harness"><div class="lab">Harness · 1–4</div><div class="sub">Denken einfangen</div></div>
    <div class="seg d" data-layer="direct"><div class="lab">Direct · 5–7</div><div class="sub">Denken lenken</div></div>
    <div class="seg a" data-layer="amplify"><div class="lab">Amplify · 8–9</div><div class="sub">Wirkung verstärken</div></div>
  </div>

  <main id="stage"></main>
</div>

/* ---------- Inhalte & Fragen ---------- */
const STEPS = [
  /* 0 */ {layer:"intro", type:"content", html:`
    <div class="eyebrow">Worum es geht</div>
    <h2>Wir steuern nicht, was Schüler tun – sondern was sie denken.</h2>
    <p class="lead">Peps McCrea fasst die Lernwissenschaft zu neun praktischen Prinzipien zusammen. Der rote Faden:
    Lernen ist der Aufbau eines starken Langzeitgedächtnisses – und der einzige Hebel dorthin ist das, worüber die Klasse gerade nachdenkt.</p>
    <div class="quote">„Gedächtnis ist der Rückstand des Denkens.“<span>— Daniel Willingham</span></div>
    <p>Dieses Modul dauert ca. <b>20 Minuten</b>. Es gibt kein „Bestehen“: Die Fragen sind nur für dich, zur eigenen Standortbestimmung.
    Du kommst aber erst weiter, wenn eine Frage gelöst ist – das hält die Bearbeitung ehrlich.</p>` },

  /* 1 */ {layer:"intro", type:"content", html:`
    <div class="eyebrow">Grundlagen · Architektur</div>
    <h2>Zwei Bauteile: Bleistift und Landkarte</h2>
    <figure>${SVG.arch}<figcaption>Das Arbeitsgedächtnis bearbeitet, das Langzeitgedächtnis bewahrt.</figcaption></figure>
    <div class="twocol">
      <div class="mini"><b class="tag-ltm">Langzeitgedächtnis (LZG)</b><br>unsere Landkarte der Welt: Wissen, Können, Überzeugungen. Sie wächst und verblasst ständig – eher Wald als Bibliothek.</div>
      <div class="mini"><b class="tag-wm">Arbeitsgedächtnis (AG)</b><br>der Bleistift, mit dem wir diese Karte zeichnen: Aufmerksamkeit, Kurzzeitspeicher und Elaboration. Hier wird bewusst gedacht.</div>
    </div>
    <p><b>Matthäus-Effekt:</b> Je mehr du weißt, desto besser kannst du denken – und je besser du denkst, desto mehr kannst du wissen. Genau diese Rückkopplung sollen wir als Lehrkräfte anwerfen.</p>` },

  /* 2 */ {layer:"intro", type:"question", qtype:"single", id:"A1",
    qmeta:"Frage 1 von 12", q:"Welche Zuordnung trifft McCreas Metapher?",
    options:[
      {t:"AG = Landkarte (Wissen), LZG = Bleistift (Denken)", c:false, fb:"Vertauscht: Das LZG ist die Landkarte, das AG der Bleistift."},

    <p>Ein leistungsfähiges LZG hat zwei Qualitäten: <b>Tiefe</b> (wie gut Wissen vernetzt und strukturiert ist) und <b>Dauerhaftigkeit</b> (wie zuverlässig es abrufbar bleibt). Verstehen braucht Erinnern – Tiefe ohne Dauerhaftigkeit verpufft.</p>` },

  /* 4 */ {layer:"intro", type:"question", qtype:"single", id:"A2",

/* ---------- Engine ---------- */
const stage = document.getElementById('stage');
const barfill = document.getElementById('barfill');
const barlabel = document.getElementById('barlabel');
const spineSegs = [...document.querySelectorAll('#spine .seg')];
let idx = 0;
const results = {}; // id -> {firstTry, attempts, solved}

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const el = (tag,cls,html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};

function updateChrome(){
  const total = STEPS.length-1;
  barfill.style.width = Math.round((idx/total)*100)+'%';
  const cur = STEPS[idx];
  barlabel.textContent = cur.type==='report' ? 'Abschluss' : `Schritt ${idx+1} von ${STEPS.length-1}`;
  spineSegs.forEach(s=>s.classList.toggle('active', s.dataset.layer===cur.layer));
}

function goNext(){ idx++; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function mark(id, ok){
  if(!results[id]) results[id]={attempts:0, firstTry:false, solved:false};
  results[id].attempts++;
  if(ok){ if(results[id].attempts===1) results[id].firstTry=true; results[id].solved=true; }
}

/* Aktionsleiste mit gating */
function actionRow(card, {gated}){
  const row = el('div','actions');
  const btn = el('button','btn primary','Weiter');
  if(gated){ btn.disabled=true; }
  btn.addEventListener('click', goNext);
  row.appendChild(btn);
  if(gated) row.appendChild(el('span','hint','Beantworte die Frage richtig, um fortzufahren.'));
  card.appendChild(row);
  return btn;
}

function render(){
  updateChrome();
  stage.innerHTML='';
  const step = STEPS[idx];
  const card = el('div','card');

  if(step.type==='content'){
    card.innerHTML = step.html;
    actionRow(card,{gated:false});
  } else if(step.type==='report'){
    renderReport(card);
  } else {
    renderQuestion(card, step);
  }
  stage.appendChild(card);
}

/* ---------- Fragetypen ---------- */
function renderQuestion(card, step){
  card.appendChild(el('div','qmeta',step.qmeta));
  card.appendChild(el('div','qtext',step.q));
  const fb = el('div','feedback');
  const next = (cb)=>actionRow(card,{gated:true}); // placeholder

  if(step.qtype==='single'){
    const opts = shuffle(step.options);
    const wrap = el('div');
    const btn = ()=>nextBtn;
    opts.forEach(o=>{
      const b=el('button','opt',`${o.t}<span class="mark"></span><span class="fb">${o.fb}</span>`);
      b.addEventListener('click',()=>{
        if(results[step.id]&&results[step.id].solved) return;
        b.classList.add('show-fb');
        b.classList.add(o.c?'is-correct':'is-wrong');
        b.querySelector('.mark').textContent=o.c?'✓':'✗';
        mark(step.id,o.c);
        if(o.c){ nextBtn.disabled=false; [...wrap.children].forEach(x=>x.disabled=true); }
      });
      wrap.appendChild(b);
    });
    card.appendChild(wrap);
    var nextBtn = actionRow(card,{gated:true});

  } else if(step.qtype==='multi'){
    const opts = shuffle(step.options);
    const wrap = el('div'); const chosen=new Set();
    opts.forEach((o,i)=>{
      const b=el('button','opt',`${o.t}<span class="mark"></span>`);
      b.addEventListener('click',()=>{
        if(b.dataset.lock) return;
        b.classList.toggle('sel');
        b.style.borderColor=b.classList.contains('sel')?'#221f1a':'';
        if(b.classList.contains('sel')) chosen.add(o); else chosen.delete(o);
      });
      b._o=o; wrap.appendChild(b);
    });
    card.appendChild(wrap);
    const check=el('button','btn ghost','Prüfen');
    const nextBtn = actionRow(card,{gated:true});
    card.querySelector('.actions').insertBefore(check, card.querySelector('.actions').firstChild);
    card.appendChild(fb);
    check.addEventListener('click',()=>{
      const ok=[...wrap.children].every(b=>{
        const want=b._o.c, has=b.classList.contains('sel');
        return want===has;
      });
      [...wrap.children].forEach(b=>{
        b.classList.remove('is-correct','is-wrong');
        if(b._o.c) b.classList.add('is-correct');
        else if(b.classList.contains('sel')) b.classList.add('is-wrong');
        b.querySelector('.mark').textContent=b._o.c?'✓':(b.classList.contains('sel')?'✗':'');
        b.dataset.lock='1';
      });
      mark(step.id,ok);
      fb.className='feedback show '+(ok?'ok':'no');
      fb.textContent = ok?step.fbOk:step.fbNo;
      if(ok){ nextBtn.disabled=false; check.disabled=true; }
      else { // erlaube neuen Versuch
        setTimeout(()=>{ [...wrap.children].forEach(b=>{delete b.dataset.lock; b.classList.remove('is-correct','is-wrong'); b.querySelector('.mark').textContent='';}); },1400);
      }
    });

  } else if(step.qtype==='truefalse'){
    const wrap=el('div');
    step.statements.forEach((st,i)=>{
      const row=el('div','tf',`<div class="stmt">${st.s}</div>
        <div class="row"><button data-v="true">Wahr</button><button data-v="false">Falsch</button></div>
        <div class="fb">${st.fb}</div>`);
      row._st=st; row._val=null;
      row.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
        if(row.dataset.lock) return;
        row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true');
        row._val = b.dataset.v==='true';
      }));
      wrap.appendChild(row);
    });
    card.appendChild(wrap);
    const check=el('button','btn ghost','Prüfen');
    const nextBtn=actionRow(card,{gated:true});
    card.querySelector('.actions').insertBefore(check, card.querySelector('.actions').firstChild);
    card.appendChild(fb);
    check.addEventListener('click',()=>{
      let allAnswered=true, allOk=true;
      [...wrap.children].forEach(row=>{
        if(row._val===null){allAnswered=false;return;}
        const ok=row._val===row._st.a;
        if(!ok) allOk=false;
        row.classList.add('done', ok?'ok':'no'); row.dataset.lock='1';
      });
      if(!allAnswered){ fb.className='feedback show no'; fb.textContent='Bitte jede Aussage bewerten.'; return; }
      mark(step.id,allOk);
      fb.className='feedback show '+(allOk?'ok':'no');
      fb.textContent=allOk?step.fbOk:step.fbNo;
      if(allOk){ nextBtn.disabled=false; check.disabled=true; }
      else setTimeout(()=>{[...wrap.children].forEach(r=>{delete r.dataset.lock; r.classList.remove('done','ok','no');});},1600);
    });

  } else if(step.qtype==='order'){
    let order = shuffle(step.correctOrder);
    const ul=el('ul'); const box=el('div','order'); box.appendChild(ul);
    function paint(){
      ul.innerHTML='';
      order.forEach((t,i)=>{
        const li=el('li',null,`<span>${t}</span><span class="ctrls"><button aria-label="hoch">↑</button><button aria-label="runter">↓</button></span>`);
        const [up,dn]=li.querySelectorAll('button');
        up.disabled=i===0; dn.disabled=i===order.length-1;
        up.addEventListener('click',()=>{ if(box.dataset.lock)return; [order[i-1],order[i]]=[order[i],order[i-1]]; paint(); });
        dn.addEventListener('click',()=>{ if(box.dataset.lock)return; [order[i+1],order[i]]=[order[i],order[i+1]]; paint(); });
        ul.appendChild(li);
      });
    }
    paint(); card.appendChild(box);
    const check=el('button','btn ghost','Prüfen');
    const nextBtn=actionRow(card,{gated:true});
    card.querySelector('.actions').insertBefore(check, card.querySelector('.actions').firstChild);
    card.appendChild(fb);
    check.addEventListener('click',()=>{
      const ok=order.every((t,i)=>t===step.correctOrder[i]);
      [...ul.children].forEach((li,i)=>li.classList.add(order[i]===step.correctOrder[i]?'ok':'no'));
      mark(step.id,ok);
      fb.className='feedback show '+(ok?'ok':'no'); fb.textContent=ok?step.fbOk:step.fbNo;
      if(ok){ box.dataset.lock='1'; nextBtn.disabled=false; check.disabled=true; }
      else setTimeout(()=>{[...ul.children].forEach(li=>li.classList.remove('ok','no'));},1400);
    });

  } else if(step.qtype==='match'){
    const box=el('div','match');
    const rights = step.rights;
    const pairs = shuffle(step.pairs);
    pairs.forEach(p=>{
      const opts = ['<option value="">— wählen —</option>'].concat(shuffle(rights).map(r=>`<option value="${r}">${r}</option>`)).join('');
      const row=el('div','pair',`<div class="left">${p.l}</div><select>${opts}</select>`);
      row._p=p; box.appendChild(row);
    });
    card.appendChild(box);
    const check=el('button','btn ghost','Prüfen');
    const nextBtn=actionRow(card,{gated:true});
    card.querySelector('.actions').insertBefore(check, card.querySelector('.actions').firstChild);
    card.appendChild(fb);
    check.addEventListener('click',()=>{
      let allOk=true, allSet=true;
      [...box.children].forEach(row=>{
        const sel=row.querySelector('select').value;
        if(!sel){allSet=false;return;}
        const ok=sel===row._p.c; if(!ok)allOk=false;
        row.classList.remove('ok','no'); row.classList.add(ok?'ok':'no');
      });
      if(!allSet){ fb.className='feedback show no'; fb.textContent='Bitte alle zuordnen.'; return; }
      mark(step.id,allOk);
      fb.className='feedback show '+(allOk?'ok':'no'); fb.textContent=allOk?step.fbOk:step.fbNo;
      if(allOk){ nextBtn.disabled=false; check.disabled=true; box.querySelectorAll('select').forEach(s=>s.disabled=true); }
    });
  }
}

/* ---------- Abschlussbericht ---------- */
function renderReport(card){
  card.classList.add('report');
  const ids = STEPS.filter(s=>s.type==='question').map(s=>s.id);
  const labels = {
    A1:"Architektur: Bleistift & Landkarte", A2:"Tiefe × Dauerhaftigkeit", MAP:"Die drei Ebenen",
    P1:"Informationen steuern", P2:"Kommunikation verschlanken", P3:"Aufmerksamkeit lenken", P4:"Last regulieren",
    P5:"Elaboration beschleunigen", P6:"Strukturen verfeinern", P7:"Veränderungen stabilisieren",
    P8:"Pädagogiken ausrichten", P9:"Metakognition verankern"
  };
  const firstTry = ids.filter(id=>results[id]&&results[id].firstTry).length;
  const total = ids.length;
  card.innerHTML = `
    <div class="eyebrow">Geschafft</div>
    <h2>Dein Durchgang</h2>
    <p class="lead"><span class="scorebig">${firstTry}/${total}</span> Fragen auf Anhieb richtig.</p>
    <p>Das ist kein Notenmaßstab, sondern eine Standortbestimmung – die Themen mit gelbem Punkt sind gute Ankerpunkte fürs Nachschlagen oder die Diskussion.</p>`;
  const grid = el('div','grid');
  ids.forEach(id=>{
    const r=results[id]||{firstTry:false,attempts:0};
    const good=r.firstTry;
    const item=el('div','item',
      `<span class="ic ${good?'g':'y'}">${good?'✓':'◐'}</span>
       <div><div>${labels[id]||id}</div><small>${good?'auf Anhieb':'nach '+(r.attempts||'–')+' Versuch(en)'}</small></div>`);
    grid.appendChild(item);
  });
  card.appendChild(grid);
  card.appendChild(el('div','legend','<span><i style="background:var(--correct)"></i>auf Anhieb richtig</span><span><i style="background:var(--accent)"></i>brauchte mehrere Versuche</span>'));

  const row=el('div','actions');
  const restart=el('button','btn ghost','Modul neu starten');
  restart.addEventListener('click',()=>{ idx=0; for(const k in results) delete results[k]; render(); window.scrollTo({top:0}); });
  row.appendChild(restart);
  card.appendChild(row);
}

render();
</script>
