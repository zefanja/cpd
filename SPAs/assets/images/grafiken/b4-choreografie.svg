<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schreiben – Sprechen – Aufrufen"><title>Schreiben – Sprechen – Aufrufen</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="900" height="480" fill="#ECEEE7"/><text x="40" y="52" font-size="26" font-weight="800" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Schreiben – Sprechen – Aufrufen</tspan></text><rect x="40" y="110" width="320" height="90" rx="10" fill="#0E5B54" stroke="#0E5B54" stroke-width="1.5" /><text x="200.0" y="148" font-size="19" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="200.0" dy="0">Alle schreiben</tspan></text><text x="200.0" y="178" font-size="15" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="200.0" dy="0">1–3 Min.</tspan></text><text x="200.0" y="236" font-size="14" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="200.0" dy="0">Aufgabe + Zeit ansagen,</tspan><tspan x="200.0" dy="18.2">„Stift läuft“</tspan></text><line x1="365" y1="92" x2="365" y2="218" stroke="#1C2422" stroke-width="2.5" stroke-dasharray="4 4"/><text x="365" y="84" font-size="12" font-weight="700" fill="#1C2422" text-anchor="middle"><tspan x="365" dy="0">Signal</tspan></text><rect x="370" y="110" width="180" height="90" rx="10" fill="#C98A1B" stroke="#C98A1B" stroke-width="1.5" /><text x="460.0" y="148" font-size="19" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="460.0" dy="0">Partnergespräch</tspan></text><text x="460.0" y="178" font-size="15" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="460.0" dy="0">30–90 Sek.</tspan></text><text x="460.0" y="236" font-size="14" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="460.0" dy="0">feste Partner,</tspan><tspan x="460.0" dy="18.2">Lehrkraft hört zu</tspan></text><line x1="555" y1="92" x2="555" y2="218" stroke="#1C2422" stroke-width="2.5" stroke-dasharray="4 4"/><text x="555" y="84" font-size="12" font-weight="700" fill="#1C2422" text-anchor="middle"><tspan x="555" dy="0">Signal</tspan></text><rect x="560" y="110" width="290" height="90" rx="10" fill="#2E5E8C" stroke="#2E5E8C" stroke-width="1.5" /><text x="705.0" y="148" font-size="19" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="705.0" dy="0">Aufrufen</tspan></text><text x="705.0" y="178" font-size="15" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="705.0" dy="0">2–3 Aufrufe</tspan></text><text x="705.0" y="236" font-size="14" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="705.0" dy="0">davon einer: „Was hat</tspan><tspan x="705.0" dy="18.2">dein Partner gesagt?“</tspan></text><rect x="40" y="300" width="820" height="150" rx="12" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><text x="60" y="332" font-size="16" font-weight="800" fill="#1C2422" text-anchor="start"><tspan x="60" dy="0">Vier Fehler, an denen das Format scheitert</tspan></text><text x="60" y="360" font-size="14" font-weight="700" fill="#B0433A" text-anchor="start"><tspan x="60" dy="0">✗ zu lang</tspan></text><text x="250" y="360" font-size="14" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="250" dy="0">→ beenden, solange das Gespräch dicht ist</tspan></text><text x="60" y="382" font-size="14" font-weight="700" fill="#B0433A" text-anchor="start"><tspan x="60" dy="0">✗ ungenaue Frage</tspan></text><text x="250" y="382" font-size="14" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="250" dy="0">→ eine Entscheidung einbauen: einigt euch, wählt, ordnet</tspan></text><text x="60" y="404" font-size="14" font-weight="700" fill="#B0433A" text-anchor="start"><tspan x="60" dy="0">✗ keine Auswertung</tspan></text><text x="250" y="404" font-size="14" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="250" dy="0">→ immer zwei bis drei Aufrufe danach</tspan></text><text x="60" y="426" font-size="14" font-weight="700" fill="#B0433A" text-anchor="start"><tspan x="60" dy="0">✗ Lehrkraft am Pult</tspan></text><text x="250" y="426" font-size="14" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="250" dy="0">→ herumgehen und zuhören</tspan></text></svg>