<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Rückmeldung an die ganze Klasse in fünf Schritten"><title>Rückmeldung an die ganze Klasse in fünf Schritten</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="900" height="480" fill="#ECEEE7"/><text x="40" y="52" font-size="26" font-weight="800" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Rückmeldung an die ganze Klasse in fünf Schritten</tspan></text><rect x="40" y="90" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0E5B54" stroke-width="1.5" /><text x="120" y="124" font-size="16" font-weight="800" fill="#0E5B54" text-anchor="middle"><tspan x="120" dy="0">1 Lesen</tspan></text><text x="120" y="172" font-size="13" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="120" dy="0">ohne Stift,</tspan><tspan x="120" dy="18.2">30 Sek. je Arbeit</tspan></text><text x="120" y="224" font-size="12.5" font-weight="700" fill="#5E6862" text-anchor="middle"><tspan x="120" dy="0">15 Min.</tspan></text><line x1="201" y1="165" x2="211" y2="165" stroke="#0E5B54" stroke-width="2.5" marker-end="url(#pf)"/><rect x="212" y="90" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0E5B54" stroke-width="1.5" /><text x="292" y="124" font-size="16" font-weight="800" fill="#0E5B54" text-anchor="middle"><tspan x="292" dy="0">2 Ein Bogen</tspan></text><text x="292" y="172" font-size="13" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="292" dy="0">3 Stärken,</tspan><tspan x="292" dy="18.2">3 Fehlermuster</tspan></text><text x="292" y="224" font-size="12.5" font-weight="700" fill="#5E6862" text-anchor="middle"><tspan x="292" dy="0">10 Min.</tspan></text><line x1="373" y1="165" x2="383" y2="165" stroke="#0E5B54" stroke-width="2.5" marker-end="url(#pf)"/><rect x="384" y="90" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0E5B54" stroke-width="1.5" /><text x="464" y="116" font-size="16" font-weight="800" fill="#0E5B54" text-anchor="middle"><tspan x="464" dy="0">3 Feedback-</tspan><tspan x="464" dy="18.4">stunde</tspan></text><text x="464" y="172" font-size="13" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="464" dy="0">Stärken zeigen,</tspan><tspan x="464" dy="18.2">neuer Zugang</tspan></text><text x="464" y="224" font-size="12.5" font-weight="700" fill="#5E6862" text-anchor="middle"><tspan x="464" dy="0">15 Min. Stundenzeit</tspan></text><line x1="545" y1="165" x2="555" y2="165" stroke="#0E5B54" stroke-width="2.5" marker-end="url(#pf)"/><rect x="556" y="90" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#C98A1B" stroke-width="3" /><text x="636" y="124" font-size="16" font-weight="800" fill="#C98A1B" text-anchor="middle"><tspan x="636" dy="0">4 Überarbeiten</tspan></text><text x="636" y="172" font-size="13" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="636" dy="0">grüner Stift,</tspan><tspan x="636" dy="18.2">konkreter Auftrag</tspan></text><text x="636" y="224" font-size="12.5" font-weight="700" fill="#5E6862" text-anchor="middle"><tspan x="636" dy="0">15 Min. Stundenzeit</tspan></text><line x1="717" y1="165" x2="727" y2="165" stroke="#0E5B54" stroke-width="2.5" marker-end="url(#pf)"/><rect x="728" y="90" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0E5B54" stroke-width="1.5" /><text x="808" y="124" font-size="16" font-weight="800" fill="#0E5B54" text-anchor="middle"><tspan x="808" dy="0">5 Stichprobe</tspan></text><text x="808" y="172" font-size="13" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="808" dy="0">5–6 Arbeiten</tspan><tspan x="808" dy="18.2">ansehen</tspan></text><text x="808" y="224" font-size="12.5" font-weight="700" fill="#5E6862" text-anchor="middle"><tspan x="808" dy="0">10 Min.</tspan></text><text x="646" y="262" font-size="13" font-weight="700" fill="#C98A1B" text-anchor="middle"><tspan x="646" dy="0">Hier wird gelernt: Die Schüler arbeiten mit ihren Fehlern.</tspan></text><text x="40" y="310" font-size="15" font-weight="800" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Lehrerzeit für einen Klassensatz Übungsarbeiten</tspan></text><rect x="40" y="326" width="820" height="40" rx="6" fill="#B0433A" stroke="#B0433A" stroke-width="1.5" /><text x="52" y="352" font-size="14.5" font-weight="700" fill="#fff" text-anchor="start"><tspan x="52" dy="0">Randkommentare an jeder Arbeit: etwa 7 Stunden</tspan></text><rect x="40" y="378" width="110" height="40" rx="6" fill="#0E5B54" stroke="#0E5B54" stroke-width="1.5" /><text x="162" y="404" font-size="14.5" font-weight="700" fill="#0E5B54" text-anchor="start"><tspan x="162" dy="0">Rückmeldung an die ganze Klasse: 45–60 Minuten</tspan></text><text x="40" y="452" font-size="13.5" font-weight="400" fill="#5E6862" text-anchor="start"><tspan x="40" dy="0">Gilt für Übungsformate. Bei benoteten Arbeiten bleiben die Vorgaben von Land und Fachkonferenz bestehen.</tspan></text></svg>