<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Drei Kernsätze und die Werkzeuge, die darauf antworten"><title>Drei Kernsätze und die Werkzeuge, die darauf antworten</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="900" height="570" fill="#ECEEE7"/><text x="40" y="52" font-size="26" font-weight="800" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Drei Kernsätze und die Werkzeuge, die darauf antworten</tspan></text><rect x="40" y="90" width="300" height="120" rx="12" fill="#FFFFFF" stroke="#2E5E8C" stroke-width="3" /><text x="190" y="156" font-size="17" font-weight="700" fill="#1C2422" text-anchor="middle"><tspan x="190" dy="0">Das Arbeitsgedächtnis ist eng.</tspan></text><line x1="340" y1="150" x2="398" y2="150" stroke="#2E5E8C" stroke-width="3" marker-end="url(#pf)"/><rect x="405" y="90" width="455" height="36" rx="8" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><circle cx="423" cy="108" r="5" fill="#2E5E8C" stroke="none" stroke-width="0"/><text x="438" y="113" font-size="14.5" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="438" dy="0">kleine Schritte, Halbier-Regel (M2.3)</tspan></text><rect x="405" y="132" width="455" height="36" rx="8" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><circle cx="423" cy="150" r="5" fill="#2E5E8C" stroke="none" stroke-width="0"/><text x="438" y="155" font-size="14.5" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="438" dy="0">Routinen schaffen Platz zum Denken (Block 1)</tspan></text><rect x="405" y="174" width="455" height="36" rx="8" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><circle cx="423" cy="192" r="5" fill="#2E5E8C" stroke="none" stroke-width="0"/><text x="438" y="197" font-size="14.5"