<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Eine Einheit rückwärts planen (Beispiel: Lineare Funktionen)"><title>Eine Einheit rückwärts planen (Beispiel: Lineare Funktionen)</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="940" height="530" fill="#ECEEE7"/><text x="40" y="52" font-size="26" font-weight="800" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Eine Einheit rückwärts planen (Beispiel: Lineare Funktionen)</tspan></text><rect x="40" y="80" width="400" height="150" rx="12" fill="#FFFFFF" stroke="#B0433A" stroke-width="2.5" /><text x="58" y="108" font-size="15.5" font-weight="800" fill="#B0433A" text-anchor="start"><tspan x="58" dy="0">1 Klassenarbeit skizzieren (zuerst!)</tspan></text><text x="58" y="134" font-size="13" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="58" dy="0">A1 Geraden zeichnen (Wiedergabe) · 8 P.</tspan><tspan x="58" dy="19.5">A2 Steigung aus zwei Punkten (Anwendung) · 10 P.</tspan><tspan x="58" dy="19.5">A3 Handytarife vergleichen (Transfer) · 8 P.</tspan><tspan x="58" dy="19.5">A4 Bruchrechnung, alter Stoff (angekündigt) · 4 P.</tspan></text><rect x="460" y="80" width="440" height="150" rx="12" fill="#FFFFFF" stroke="#0E5B54" stroke-width="2.5" /><text x="478" y="108" font-size="15.5" font-weight="800" fill="#0E5B54" text-anchor="start"><tspan x="478" dy="0">2 Meilensteine der Einheit</tspan></text><text x="478" y="134" font-size="13" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="478" dy="0">kann Punkte ablesen und eintragen</tspan><tspan x="478" dy="19.5">kann eine Gerade aus der Gleichung zeichnen</tspan><tspan x="478" dy="19.5">kann die Steigung bestimmen</tspan><tspan x="478" dy="19.5">kann eine Sachsituation als Gleichung schreiben</tspan></text><rect x="40" y="250" width="860" height="150" rx="12" fill="#FFFFFF" stroke="#2E5E8C" stroke-width="2.5" /><text x="58" y="278" font-size="15.5" font-weight="800" fill="#2E5E8C" text-anchor="start"><tspan x="58" dy="0">3 Stundenkette (mit Bleistift) und Puffer</tspan></text><rect x="58" y="294" width="106" height="62" rx="8" fill="#E0ECE9" stroke="#D6DAD0" stroke-width="1" /><text x="111" y="316" font-size="13.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="111" dy="0">Std. 1</tspan></text><text x="111" y="334" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="111" dy="0">Punkte</tspan></text><rect x="176" y="294" width="106" height="62" rx="8" fill="#E0ECE9" stroke="#D6DAD0" stroke-width="1" /><text x="229" y="316" font-size="13.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="229" dy="0">Std. 2</tspan></text><text x="229" y="334" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="229" dy="0">Zeichnen</tspan></text><rect x="294" y="294" width="106" height="62" rx="8" fill="#E0ECE9" stroke="#D6DAD0" stroke-width="1" /><text x="347" y="316" font-size="13.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="347" dy="0">Std. 3</tspan></text><text x="347" y="334" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="347" dy="0">Steigung</tspan></text><rect x="412" y="294" width="106" height="62" rx="8" fill="#E0ECE9" stroke="#D6DAD0" stroke-width="1" /><text x="465" y="316" font-size="13.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="465" dy="0">Std. 4</tspan></text><text x="465" y="334" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="465" dy="0">Steigung</tspan></text><rect x="530" y="294" width="106" height="62" rx="8" fill="#E0ECE9" stroke="#D6DAD0" stroke-width="1" /><text x="583" y="316" font-size="13.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="583" dy="0">Std. 5</tspan></text><text x="583" y="334" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="583" dy="0">Sach-</tspan><tspan x="583" dy="13.799999999999999">aufgaben</tspan></text><rect x="648" y="294" width="106" height="62" rx="8" fill="#FBF3DF" stroke="#C98A1B" stroke-width="2" stroke-dasharray="6 4"/><text x="701" y="316" font-size="13.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="701" dy="0">Puffer</tspan></text><text x="701" y="334" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="701" dy="0">frei</tspan></text><rect x="766" y="294" width="106" height="62" rx="8" fill="#F5E4E2" stroke="#D6DAD0" stroke-width="1" /><text x="819" y="316" font-size="13.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="819" dy="0">Arbeit</tspan></text><text x="819" y="334" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="819" dy="0"></tspan></text><text x="58" y="384" font-size="13" font-weight="600" fill="#5E6862" text-anchor="start"><tspan x="58" dy="0">Nach jedem Exit Ticket: fünf Minuten am Abend – was ändert sich morgen?</tspan></text><rect x="40" y="420" width="860" height="86" rx="12" fill="#FFFFFF" stroke="#4E7A38" stroke-width="2.5" /><text x="58" y="448" font-size="15.5" font-weight="800" fill="#4E7A38" text-anchor="start"><tspan x="58" dy="0">4 Stellen für die Wiederholung</tspan></text><text x="58" y="474" font-size="13" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="58" dy="0">Stoff aus Std. 1 kehrt in Std. 4 zurück (Do Now) · alte Einheit „Bruchrechnung“: Do Now ☑  Übungsblatt ☑  Arbeit ☑</tspan></text></svg>