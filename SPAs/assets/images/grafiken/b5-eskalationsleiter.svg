<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 520" width="930" height="520" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Wenn die Leiter nicht reicht: Stufe 6 und was danach kommt"><title>Wenn die Leiter nicht reicht: Stufe 6 und was danach kommt</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="930" height="520" fill="#ECEEE7"/><text x="40" y="52" font-size="26" font-weight="800" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Wenn die Leiter nicht reicht: Stufe 6 und was danach kommt</tspan></text><rect x="40" y="420" width="420" height="48" rx="8" fill="#FFFFFF" stroke="#4E7A38" stroke-width="2.5" /><text x="56" y="450" font-size="14.5" font-weight="700" fill="#1C2422" text-anchor="start"><tspan x="56" dy="0">1 Nonverbal: Blick, Geste, Nähe</tspan></text><rect x="66" y="362" width="420" height="48" rx="8" fill="#FFFFFF" stroke="#4E7A38" stroke-width="2.5" /><text x="82" y="392" font-size="14.5" font-weight="700" fill="#1C2422" text-anchor="start"><tspan x="82" dy="0">2 Positive Gruppenkorrektur</tspan></text><rect x="92" y="304" width="420" height="48" rx="8" fill="#FFFFFF" stroke="#D9A21E" stroke-width="2.5" /><text x="108" y="334" font-size="14.5" font-weight="700" fill="#1C2422" text-anchor="start"><tspan x="108" dy="0">3 Anonyme Einzelkorrektur</tspan></text><rect x="118" y="246" width="420" height="48" rx="8" fill="#FFFFFF" stroke="#D9A21E" stroke-width="2.5" /><text x="134" y="276" font-size="14.5" font-weight="700" fill="#1C2422" text-anchor="start"><tspan x="134" dy="0">4 Private Einzelkorrektur</tspan></text><rect x="144" y="188" width="420" height="48" rx="8" fill="#FFFFFF" stroke="#C98A1B" stroke-width="2.5" /><text x="160" y="218" font-size="14.5" font-weight="700" fill="#1C2422" text-anchor="start"><tspan x="160" dy="0">5 Blitzschnelle öffentliche Korrektur</tspan></text><rect x="170" y="130" width="420" height="48" rx="8" fill="#FFFFFF" stroke="#B0433A" stroke-width="2.5" /><text x="186" y="160" font-size="14.5" font-weight="700" fill="#1C2422" text-anchor="start"><tspan x="186" dy="0">6 Konsequenz (Kette der Schule)</tspan></text><text x="40" y="496" font-size="13.5" font-weight="400" fill="#5E6862" text-anchor="start"><tspan x="40" dy="0">Interventionsleiter aus Modul 1.5: immer die kleinste wirksame Stufe.</tspan></text><rect x="640" y="88" width="250" height="104" rx="10" fill="#F5E4E2" stroke="#B0433A" stroke-width="2" /><text x="765" y="114" font-size="14.5" font-weight="800" fill="#B0433A" text-anchor="middle"><tspan x="765" dy="0">Stufe 6 im Detail (M5.4)</tspan></text><text x="765" y="138" font-size="12.5" font-weight="500" fill="#1C2422" text-anchor="middle"><tspan x="765" dy="0">angekündigt · ruhig · verhältnismäßig</tspan><tspan x="765" dy="18.75">vorher: Rechnet er mit dem Scheitern?</tspan></text><line x1="596" y1="150" x2="636" y2="140" stroke="#B0433A" stroke-width="2.5" marker-end="url(#pf)"/><rect x="640" y="212" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#0E5B54" stroke-width="2" /><text x="765" y="238" font-size="14.5" font-weight="800" fill="#0E5B54" text-anchor="middle"><tspan x="765" dy="0">Danach: Gespräch (W.I.N.)</tspan></text><text x="765" y="260" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="765" dy="0">Die Konsequenz beendet den Vorfall,</tspan><tspan x="765" dy="16.799999999999997">das Gespräch verhindert den nächsten.</tspan></text><rect x="640" y="304" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#2E5E8C" stroke-width="2" /><text x="765" y="330" font-size="14.5" font-weight="800" fill="#2E5E8C" text-anchor="middle"><tspan x="765" dy="0">Protokoll</tspan></text><text x="765" y="352" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="765" dy="0">nur Beobachtungen, Uhrzeit,</tspan><tspan x="765" dy="16.799999999999997">wörtliche Zitate – keine Wertungen</tspan></text><line x1="765" y1="292" x2="765" y2="302" stroke="#5E6862" stroke-width="2" marker-end="url(#pf)"/><rect x="640" y="396" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#C98A1B" stroke-width="2" /><text x="765" y="422" font-size="14.5" font-weight="800" fill="#C98A1B" text-anchor="middle"><tspan x="765" dy="0">Hilfe holen</tspan></text><text x="765" y="444" font-size="12" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="765" dy="0">Lage – was ich versucht habe –</tspan><tspan x="765" dy="16.799999999999997">meine Frage</tspan></text><line x1="765" y1="384" x2="765" y2="394" stroke="#5E6862" stroke-width="2" marker-end="url(#pf)"/><line x1="765" y1="192" x2="765" y2="210" stroke="#5E6862" stroke-width="2" marker-end="url(#pf)"/></svg>