<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label=""><title></title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="960" height="560" fill="#F3F3F3"/><rect x="20" y="20" width="920" height="520" rx="6" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><text x="40" y="62" font-size="21" font-weight="700" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Der Wasserkreislauf – Grundlagen, Teilprozesse und Sonderfälle im Überblick</tspan></text><text x="40" y="96" font-size="12.5" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Der Wasserkreislauf beschreibt den ständigen Transport und die Speicherung von Wasser auf der Erde,</tspan><tspan x="40" dy="17.75">wobei das Wasser, das an der Oberfläche der Ozeane und in geringerem Maß auch an Landflächen durch</tspan><tspan x="40" dy="17.75">die Energie der Sonne verdunstet, in der Atmosphäre aufsteigt und dort, sobald es in höheren und damit</tspan><tspan x="40" dy="17.75">kälteren Schichten abkühlt, an kleinsten Teilchen zu Tröpfchen kondensiert, aus denen sich Wolken</tspan><tspan x="40" dy="17.75">bilden, die vom Wind verfrachtet werden, bis die Tröpfchen so schwer geworden sind, dass sie als</tspan><tspan x="40" dy="17.75">Niederschlag in Form von Regen, Schnee oder Hagel wieder zur Erde fallen, wo das Wasser teils</tspan><tspan x="40" dy="17.75">versickert und das Grundwasser speist, teils oberirdisch über Bäche und Flüsse abfließt und</tspan><tspan x="40" dy="17.75">schließlich wieder ins Meer gelangt, womit der Kreislauf von vorn beginnt, wobei zu beachten ist,</tspan><tspan x="40" dy="17.75">dass ein Teil des Niederschlags bereits vor Erreichen des Bodens wieder verdunstet und ein weiterer</tspan><tspan x="40" dy="17.75">Teil von Pflanzen aufgenommen und über die Blätter abgegeben wird (Transpiration), sodass man</tspan><tspan x="40" dy="17.75">zusammenfassend auch von Evapotranspiration spricht.</tspan></text><text x="40" y="310" font-size="14" font-weight="700" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">• Sonderfälle</tspan></text><text x="58" y="332" font-size="12.5" font-weight="400" fill="#1C2422" text-anchor="start"><tspan x="58" dy="0">– Sublimation (Eis → Wasserdampf)</tspan><tspan x="58" dy="18.75">     · v. a. in Hochgebirgen und Polargebieten</tspan><tspan x="58" dy="18.75">– Interzeption (Benetzung der Vegetation)</tspan><tspan x="58" dy="18.75">     · abhängig von Blattfläche und Niederschlagsart</tspan><tspan x="58" dy="18.75">– Oberflächenabfluss vs. Zwischenabfluss vs. Basisabfluss</tspan><tspan x="58" dy="18.75">     · siehe Abflussganglinie (nächste Stunde)</tspan></text><g transform="translate(620,360) scale(0.48)"><path d="M0 230 Q60 205 120 230 T240 230 T360 230 L360 290 L0 290z" fill="#BFD7EA"/><path d="M360 290 L360 200 L470 90 L560 180 L620 150 L620 290z" fill="#C9CFB8"/><ellipse cx="180" cy="55" rx="80" ry="30" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="2"/><ellipse cx="455" cy="50" rx="75" ry="28" fill="#DDE3E6" stroke="#9AA6AA" stroke-width="2"/><path d="M120 215 C100 160 120 120 150 92" stroke="#2E5E8C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pf)"/><path d="M262 50 L372 48" stroke="#2E5E8C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pf)"/><line x1="430" y1="85" x2="420" y2="125" stroke="#2E5E8C" stroke-width="3"/><line x1="455" y1="85" x2="445" y2="125" stroke="#2E5E8C" stroke-width="3"/><line x1="480" y1="85" x2="470" y2="125" stroke="#2E5E8C" stroke-width="3"/><path d="M520 200 C470 250 420 262 372 250" stroke="#2E5E8C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pf)"/></g><circle cx="830" cy="300" r="34" fill="#F4C430" stroke="#D9A21E" stroke-width="3"/><line x1="870.0" y1="300.0" x2="884.0" y2="300.0" stroke="#D9A21E" stroke-width="4"/><line x1="864.6410161513776" y1="320.0" x2="876.7653718043597" y2="327.0" stroke="#D9A21E" stroke-width="4"/><line x1="850.0" y1="334.6410161513775" x2="857.0" y2="346.7653718043597" stroke="#D9A21E" stroke-width="4"/><line x1="830.0" y1="340.0" x2="830.0" y2="354.0" stroke="#D9A21E" stroke-width="4"/><line x1="810.0" y1="334.6410161513775" x2="803.0" y2="346.7653718043597" stroke="#D9A21E" stroke-width="4"/><line x1="795.3589838486224" y1="320.0" x2="783.2346281956403" y2="327.0" stroke="#D9A21E" stroke-width="4"/><line x1="790.0" y1="300.0" x2="776.0" y2="300.0" stroke="#D9A21E" stroke-width="4"/><line x1="795.3589838486224" y1="280.0" x2="783.2346281956403" y2="273.0" stroke="#D9A21E" stroke-width="4"/><line x1="810.0" y1="265.3589838486225" x2="803.0" y2="253.2346281956403" stroke="#D9A21E" stroke-width="4"/><line x1="830.0" y1="260.0" x2="830.0" y2="246.0" stroke="#D9A21E" stroke-width="4"/><line x1="850.0" y1="265.3589838486225" x2="857.0" y2="253.2346281956403" stroke="#D9A21E" stroke-width="4"/><line x1="864.6410161513776" y1="280.0" x2="876.7653718043597" y2="273.0" stroke="#D9A21E" stroke-width="4"/><rect x="808" y="288" width="20" height="13" rx="4" fill="#1C2422" stroke="#1C2422" stroke-width="1.5" /><rect x="832" y="288" width="20" height="13" rx="4" fill="#1C2422" stroke="#1C2422" stroke-width="1.5" /><line x1="828" y1="292" x2="832" y2="292" stroke="#1C2422" stroke-width="3"/><path d="M815 314 Q830 326 845 314" stroke="#1C2422" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="915" y="525" font-size="11" font-weight="400" fill="#5E6862" text-anchor="end"><tspan x="915" dy="0">Folie 7 von 43</tspan></text></svg>