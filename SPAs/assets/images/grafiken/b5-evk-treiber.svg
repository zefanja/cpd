nt-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="470" dy="0">Wert ↑</tspan></text><text x="470" y="372" font-size="11" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="470" dy="0">die arbeitende Mehrheit</tspan><tspan x="470" dy="15.399999999999999">sichtbar machen</tspan></text><rect x="562" y="232" width="164" height="220" rx="12" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><rect x="562" y="232" width="164" height="8" rx="4" fill="#C98A1B" stroke="#C98A1B" stroke-width="1.5" /><text x="644" y="268" font-size="14.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="644" dy="0">4 Build Belonging</tspan></text><text x="644" y="290" font-size="13.5" font-weight="500" fill="#5E6862" text-anchor="middle"><tspan x="644" dy="0">Zugehörigkeit</tspan></text><rect x="576" y="306" width="136" height="34" rx="8" fill="#C98A1B" stroke="#C98A1B" stroke-width="1.5" /><text x="644" y="329" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="644" dy="0">Wert ↑  Kosten ↓</tspan></text><text x="644" y="372" font-size="11" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="644" dy="0">kurzer echter Kontakt,</tspan><tspan x="644" dy="15.399999999999999">Zusagen halten</tspan></text><rect x="736" y="232" width="164" height="220" rx="12" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><rect x="736" y="232" width="164" height="8" rx="4" fill="#4E7A38" stroke="#4E7A38" stroke-width="1.5" /><text x="818" y="268" font-size="14.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="818" dy="0">5 Boost Buy-in</tspan></text><text x="818" y="290" font-size="13.5" font-weight="500" fill="#5E6862" text-anchor="middle"><tspan x="818" dy="0">Zustimmung</tspan></text><rect x="750" y="306" width="136" height="34" rx="8" fill="#4E7A38" stroke="#4E7A38" stroke-width="1.5" /><text x="818" y="329" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="818" dy="0">Wert ↑</tspan></text><text x="818" y="372" font-size="11" font-weight="400" fill="#1C2422" text-anchor="middle"><tspan x="818" dy="0">begründen, echte Wahl</tspan><tspan x="818" dy="15.399999999999999">im Wie, System erklären</tspan></text><text x="40" y="490" font-size="14" font-weight="600" fill="#5E6862" text-anchor="start"><tspan x="40" dy="0">Ist die Erwartung null, bleibt das Ergebnis null – egal wie spannend das Thema ist. Deshalb zuerst die Erwartung prüfen.</tspan></text></svg>