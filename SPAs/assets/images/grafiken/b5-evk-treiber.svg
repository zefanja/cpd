<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 515" width="940" height="515" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Warum Menschen sich anstrengen – und die fünf Treiber"><title>Warum Menschen sich anstrengen – und die fünf Treiber</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="940" height="515" fill="#ECEEE7"/><text x="40" y="52" font-size="26" font-weight="800" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Warum Menschen sich anstrengen – und die fünf Treiber</tspan></text><rect x="40" y="78" width="860" height="96" rx="14" fill="#FFFFFF" stroke="#0E5B54" stroke-width="2.5" /><text x="470" y="138" font-size="30" font-weight="800" fill="#0E5B54" text-anchor="middle"><tspan x="470" dy="0">Anstrengung  =  Erwartung  ×  Wert  ÷  Kosten</tspan></text><text x="380" y="196" font-size="13.5" font-weight="600" fill="#2E5E8C" text-anchor="middle"><tspan x="380" dy="0">„Schaffe ich das?“</tspan></text><text x="583" y="196" font-size="13.5" font-weight="600" fill="#4E7A38" text-anchor="middle"><tspan x="583" dy="0">„Bringt es mir etwas?“</tspan></text><text x="770" y="196" font-size="13.5" font-weight="600" fill="#B0433A" text-anchor="middle"><tspan x="770" dy="0">„Was riskiere ich?“</tspan></text><rect x="40" y="232" width="164" height="220" rx="12" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><rect x="40" y="232" width="164" height="8" rx="4" fill="#2E5E8C" stroke="#2E5E8C" stroke-width="1.5" /><text x="122" y="268" font-size="14.5" font-weight="800" fill="#1C2422" text-anchor="middle"><tspan x="122" dy="0">1 Secure Success</tspan></text><text x="122" y="290" font-size="13.5" font-weight="500" fill="#5E6862" text-anchor="middle"><tspan x="122" dy="0">Erfolg ermöglichen</tspan></text><rect x="54" y="306" width="136" height="34" rx="8" fill="#2E5E