<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 550" width="930" height="550" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Drei Quellen unnötiger Belastung"><title>Drei Quellen unnötiger Belastung</title><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="930" height="550" fill="#ECEEE7"/><text x="40" y="52" font-size="26" font-weight="800" fill="#1C2422" text-anchor="start"><tspan x="40" dy="0">Drei Quellen unnötiger Belastung</tspan></text><rect x="40" y="85" width="270" height="370" rx="12" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><rect x="40" y="85" width="270" height="8" rx="4" fill="#B0433A" stroke="#B0433A" stroke-width="1.5" /><text x="175" y="128" font-size="21" font-weight="800" fill="#B0433A" text-anchor="middle"><tspan x="175" dy="0">Split Attention</tspan></text><rect x="75" y="180" width="70" height="50" rx="6" fill="#E0ECE9" stroke="#0E5B54" stroke-width="1.5" /><text x="110" y="211" font-size="13" font-weight="600" fill="#0E5B54" text-anchor="middle"><tspan x="110" dy="0">Folie</tspan></text><rect x="205" y="180" width="70" height="50" rx="6" fill="#FBF3DF" stroke="#C98A1B" stroke-width="1.5" /><text x="240" y="211" font-size="13" font-weight="600" fill="#C98A1B" text-anchor="middle"><tspan x="240" dy="0">Rede</tspan></text><path d="M110 233 L167 273" stroke="#0E5B54" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pf)"/><path d="M240 233 L183 273" stroke="#C98A1B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pf)"/><circle cx="175" cy="287" r="15" fill="#FFFFFF" stroke="#B0433A" stroke-width="3"/><text x="175" y="293" font-size="18" font-weight="800" fill="#B0433A" text-anchor="middle"><tspan x="175" dy="0">!</tspan></text><text x="175" y="325" font-size="15" font-weight="600" fill="#1C2422" text-anchor="middle"><tspan x="175" dy="0">Zwei Quellen wollen</tspan><tspan x="175" dy="19.5">gleichzeitig gelesen werden.</tspan></text><text x="175" y="392" font-size="13" font-weight="400" fill="#5E6862" text-anchor="middle"><tspan x="175" dy="0">Beispiel: Die Klasse liest die Folie,</tspan><tspan x="175" dy="16.900000000000002">während du etwas anderes erzählst.</tspan></text><rect x="330" y="85" width="270" height="370" rx="12" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><rect x="330" y="85" width="270" height="8" rx="4" fill="#C98A1B" stroke="#C98A1B" stroke-width="1.5" /><text x="465" y="128" font-size="21" font-weight="800" fill="#C98A1B" text-anchor="middle"><tspan x="465" dy="0">Redundanz</tspan></text><rect x="385" y="180" width="160" height="34" rx="6" fill="#E0ECE9" stroke="#0E5B54" stroke-width="1.5" /><text x="465" y="202" font-size="13" font-weight="600" fill="#0E5B54" text-anchor="middle"><tspan x="465" dy="0">Text lesen</tspan></text><rect x="385" y="223" width="160" height="34" rx="6" fill="#E0ECE9" stroke="#0E5B54" stroke-width="1.5" /><text x="465" y="245" font-size="12" font-weight="600" fill="#0E5B54" text-anchor="middle"><tspan x="465" dy="0">denselben Text hören</tspan></text><text x="465" y="291" font-size="13" font-weight="700" fill="#C98A1B" text-anchor="middle"><tspan x="465" dy="0">= 2 × Aufwand, 1 × Inhalt</tspan></text><text x="465" y="325" font-size="15" font-weight="600" fill="#1C2422" text-anchor="middle"><tspan x="465" dy="0">Dasselbe kommt doppelt</tspan><tspan x="465" dy="19.5">und muss abgeglichen werden.</tspan></text><text x="465" y="392" font-size="13" font-weight="400" fill="#5E6862" text-anchor="middle"><tspan x="465" dy="0">Beispiel: Du liest den Folientext</tspan><tspan x="465" dy="16.900000000000002">wörtlich vor.</tspan></text><rect x="620" y="85" width="270" height="370" rx="12" fill="#FFFFFF" stroke="#D6DAD0" stroke-width="1.5" /><rect x="620" y="85" width="270" height="8" rx="4" fill="#2E5E8C" stroke="#2E5E8C" stroke-width="1.5" /><text x="755" y="128" font-size="21" font-weight="800" fill="#2E5E8C" text-anchor="middle"><tspan x="755" dy="0">Transienz</tspan></text><text x="651" y="225" font-size="14" font-weight="700" fill="#2E5E8C" opacity="1">Schritt 1</text><text x="725" y="225" font-size="14" font-weight="700" fill="#2E5E8C" opacity="0.6">Schritt 2</text><text x="799" y="225" font-size="14" font-weight="700" fill="#2E5E8C" opacity="0.3">Schritt 3</text><path d="M659 255 L841 255" stroke="#2E5E8C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 7" marker-end="url(#pf)"/><text x="755" y="287" font-size="13" font-weight="700" fill="#2E5E8C" text-anchor="middle" font-style="italic"><tspan x="755" dy="0">verweht</tspan></text><text x="755" y="325" font-size="15" font-weight="600" fill="#1C2422" text-anchor="middle"><tspan x="755" dy="0">Gesprochenes ist sofort weg.</tspan></text><text x="755" y="392" font-size="13" font-weight="400" fill="#5E6862" text-anchor="middle"><tspan x="755" dy="0">Beispiel: Die Anweisung mit drei</tspan><tspan x="755" dy="16.900000000000002">Schritten gibt es nur mündlich.</tspan></text><rect x="40" y="475" width="850" height="54" rx="10" fill="#E0ECE9" stroke="#0E5B54" stroke-width="1.5" /><text x="465" y="508" font-size="18" font-weight="700" fill="#0E5B54" text-anchor="middle"><tspan x="465" dy="0">Schwer darf die Sache sein – nicht der Weg zu ihr.</tspan></text></svg>