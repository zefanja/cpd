<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach-Dashboard · CPD Fortbildung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEE7;--card:#FFFFFF;--ink:#1C2422;--muted:#5E6862;--line:#D6DAD0;
  --petrol:#0E5B54;--petrol-soft:#E0ECE9;--amber:#C98A1B;--red:#B33B2A;--radius:14px;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh}
header{
  background:var(--card);border-bottom:1px solid var(--line);padding:1.1rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;
}
.brand{font-family:var(--display);font-weight:800;color:var(--petrol);font-size:1.15rem}
.logout{font-size:.85rem;color:var(--muted);text-decoration:underline;cursor:pointer;border:none;background:none;font-family:inherit}
.site-footer{font-size:.8rem;color:var(--muted);text-align:center;padding:0 1.5rem}
.site-footer a{color:var(--muted);text-decoration:underline}
main{max-width:64rem;margin:0 auto;padding:2rem 1.5rem 4rem;display:flex;flex-direction:column;gap:2rem}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem}
section h2{font-family:var(--display);font-size:1.15rem;margin-bottom:1rem;color:var(--petrol)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:none}
.inline-form{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.78rem;color:var(--muted);font-weight:600}
input[type=text],input[type=email],input[type=password],select{
  padding:.5rem .65rem;border:1.5px solid var(--line);border-radius:8px;font-size:.9rem;font-family:inherit;
}
button.primary{
  padding:.55rem 1.1rem;border:none;border-radius:8px;background:var(--petrol);color:#fff;
  font-weight:700;font-size:.9rem;cursor:pointer;
}
button.primary:hover{background:#0a4740}
button.ghost{
  padding:.35rem .7rem;border:1px solid var(--line);border-radius:8px;background:none;
  color:var(--muted);font-size:.8rem;cursor:pointer;
}
button.ghost:hover{border-color:var(--red);color:var(--red)}
code.token{
  background:var(--petrol-soft);color:var(--petrol);padding:.15rem .5rem;border-radius:6px;
  font-weight:700;letter-spacing:.06em;
}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:.2rem .55rem;border-radius:99px}
.badge.open{background:#EDEBE4;color:var(--muted)}
.badge.progress{background:#FCEFD9;color:var(--amber)}
.badge.done{background:var(--petrol-soft);color:var(--petrol)}
.matrix input[type=checkbox]{width:1.1rem;height:1.1rem;accent-color:var(--petrol)}
.matrix-scroll{overflow-x:auto;overflow-y:hidden}
.matrix{width:auto;border-collapse:collapse}
.matrix th,.matrix td{white-space:nowrap;padding:.45rem .5rem}
.matrix th:not(.rowhead),.matrix td:not(.rowhead){text-align:center;min-width:2.6rem}
.matrix th.rowhead,.matrix td.rowhead{
  position:sticky;left:0;background:var(--card);border-right:1px solid var(--line);
  min-width:9rem;max-width:14rem;white-space:normal;
}
.matrix .rowhead .sub{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.matrix th abbr{text-decoration:none;border-bottom:1px dotted var(--muted);cursor:help;font-weight:700}
.matrix th .colToggleAll{display:block;margin:0 auto .3rem}
.toggle-line{
  display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--muted);
  margin-bottom:1rem;cursor:pointer;user-select:none;
}
.toggle-line input{width:1.05rem;height:1.05rem;accent-color:var(--petrol)}
input.nameEdit{
  width:100%;padding:.35rem .5rem;border:1.5px solid transparent;border-radius:6px;
  font-size:.9rem;font-family:inherit;background:none;color:var(--ink);
}
input.nameEdit:hover{border-color:var(--line)}
input.nameEdit:focus{border-color:var(--petrol);outline:none;background:var(--card)}
.course-toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.course-count{color:var(--muted);font-size:.85rem}
.course-search{
  padding:.5rem .65rem;border:1.5px solid var(--line);border-radius:8px;font-size:.85rem;
  font-family:inherit;width:100%;max-width:16rem;
}
.course-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem;
}
.course-card{
  border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;background:var(--bg);
  display:flex;flex-direction:column;gap:.4rem;
}
.course-card input.courseNameEdit{font-weight:600;padding:.3rem .35rem;text-overflow:ellipsis}
.course-card .badge{align-self:flex-start}
.msg{font-size:.85rem;padding:.6rem .8rem;border-radius:8px;margin-top:.8rem}
.msg.error{background:#FBEAE7;color:#8a3220}
.msg.hidden{display:none}
.muted{color:var(--muted);font-size:.85rem}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
#loginScreen .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:2.25rem 2rem;max-width:24rem;width:100%}
#loginScreen h1{font-family:var(--display);font-size:1.4rem;color:var(--petrol);margin-bottom:1.2rem}
#loginScreen .field{margin-bottom:.9rem}
#loginScreen button{width:100%;margin-top:.5rem}
.hidden{display:none !important}
.cell-open{border:none;background:none;padding:0;cursor:pointer;font:inherit}
.cell-open:hover .badge{filter:brightness(0.94)}
.overlay{
  position:fixed;inset:0;background:rgba(28,36,34,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:3rem 1.5rem;overflow-y:auto;z-index:50;
}
.overlay-panel{
  background:var(--card);border-radius:var(--radius);max-width:38rem;width:100%;
  padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.overlay-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.5rem}
.overlay-head h2{font-family:var(--display);font-size:1.1rem;color:var(--petrol)}
.answers-body{
  white-space:pre-wrap;font-family:'Inter',system-ui,sans-serif;font-size:.85rem;line-height:1.5;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:1rem;margin-top:1rem;
  max-height:60vh;overflow-y:auto;
}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.section-head h2{margin-bottom:0}
#printCodes{display:none}

@media print{
  #loginScreen, #app, #answersOverlay, #passwordOverlay{display:none !important}
  #printCodes{
    display:block;width:100%;margin:0;padding:0;background:#fff;
  }
  .print-head{padding:0 0 .3rem;margin-bottom:.6rem;border-bottom:2px solid var(--petrol)}
  .print-head h1{font-family:var(--display);font-size:1.2rem;color:var(--petrol)}
  .print-head p{font-size:.75rem;color:var(--muted);margin-top:.15rem}
  .code-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
  .code-card{
    border:1px dashed #999;padding:.7rem .8rem;break-inside:avoid;page-break-inside:avoid;
    display:flex;flex-direction:column;gap:.25rem;margin:-1px 0 0 -1px;
  }
  .code-card .course{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .code-card .name{font-family:var(--display);font-weight:700;font-size:1rem;color:var(--ink)}
  .code-card .code{
    font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.1em;color:var(--petrol);
  }
  .code-card .url{font-size:.75rem;color:var(--ink)}
  .code-card .inactive-note{font-size:.7rem;color:var(--red);font-weight:700}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="card">
    <h1>Coach-Dashboard</h1>
    <form id="loginForm">
      <div class="field"><label for="email">E-Mail</label><input type="email" id="email" required></div>
      <div class="field"><label for="password">Passwort</label><input type="password" id="password" required></div>
      <button class="primary" type="submit">Anmelden</button>
      <div class="msg error hidden" id="loginError"></div>
    </form>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div class="brand">CPD Fortbildung · Coach-Dashboard</div>
  <div style="display:flex;align-items:center;gap:1.1rem">
    <button class="logout" id="changePasswordBtn" type="button">Passwort ändern</button>
    <button class="logout" id="logoutBtn">Abmelden</button>
  </div>
</header>
<main>

  <section id="coursesSection">
    <h2>Kurse</h2>
    <div class="course-toolbar">
      <span class="course-count" id="courseCount"></span>
      <input type="search" id="courseFilter" class="course-search" placeholder="Kurs suchen …">
    </div>
    <div id="coursesGrid" class="course-grid"></div>
    <form class="inline-form" id="courseForm">
      <div class="field"><label for="courseName">Neuer Kurs</label><input type="text" id="courseName" placeholder="z. B. Kohorte 2026" required></div>
      <button class="primary" type="submit">Anlegen</button>
    </form>
  </section>

  <section id="teachersSection">
    <div class="section-head">
      <h2>Lehrkräfte</h2>
      <button class="ghost" id="printCodesBtn" type="button">Alle Codes als PDF drucken</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Code</th><th>Kurs</th><th>Aktiv</th><th></th></tr></thead>
      <tbody id="teachersTable"></tbody>
    </table>
    <form class="inline-form" id="teacherForm">
      <div class="field"><label for="teacherName">Name</label><input type="text" id="teacherName" placeholder="Name der Lehrkraft" required></div>
      <div class="field"><label for="teacherCourse">Kurs</label><select id="teacherCourse"></select></div>
      <button class="primary" type="submit">Account anlegen</button>
    </form>
    <div class="msg hidden" id="teacherMsg" style="background:var(--petrol-soft);color:var(--petrol)"></div>
  </section>

  <section id="visibilitySection">
    <h2>Sichtbarkeit der Module (pro Kurs)</h2>
    <div id="visibilityWrap"><p class="muted">Lade …</p></div>
  </section>

  <section id="progressSection">
    <h2>Fortschritt</h2>
    <label class="toggle-line"><input type="checkbox" id="hideDoneModules"> Erledigte Module ausblenden</label>
    <div id="progressWrap"><p class="muted">Lade …</p></div>
  </section>

</main>
<footer class="site-footer">
  <a href="../../uebersicht.html">Zur bisherigen Dokumenten-Übersicht</a>
</footer>
</div>

<div id="printCodes"></div>

<div id="answersOverlay" class="overlay hidden">
  <div class="overlay-panel">
    <div class="overlay-head">
      <h2 id="answersTitle"></h2>
      <button type="button" class="ghost" id="answersClose">Schließen ✕</button>
    </div>
    <div id="answersStatus" class="msg hidden"></div>
    <pre id="answersBody" class="answers-body hidden"></pre>
  </div>
</div>

<div id="passwordOverlay" class="overlay hidden">
  <div class="overlay-panel" style="max-width:24rem">
    <div class="overlay-head">
      <h2>Passwort ändern</h2>
      <button type="button" class="ghost" id="passwordClose">Schließen ✕</button>
    </div>
    <form id="passwordForm">
      <div class="field" style="margin-bottom:.9rem">
        <label for="newPassword">Neues Passwort</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field" style="margin-bottom:.9rem">
        <label for="newPasswordRepeat">Neues Passwort (Wiederholung)</label>
        <input type="password" id="newPasswordRepeat" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="primary" type="submit">Passwort speichern</button>
      <div class="msg hidden" id="passwordMsg"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../shared/cpd-config.js"></script>
<script src="../shared/cpd-client.js"></script>
<script>
var client = window.CPD.createCoachClient();
var db = { courses: [], teachers: [], modules: [], courseModules: [], progress: [] };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function isCoach(session) {
  return !!(session && session.user && session.user.app_metadata && session.user.app_metadata.role === 'coach');
}

async function boot() {
  var { data } = await client.auth.getSession();
  if (isCoach(data.session)) showApp();
  else showLogin();
}

function showLogin(errorText) {
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  var err = document.getElementById('loginError');
  if (errorText) { err.textContent = errorText; err.classList.remove('hidden'); }
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadAll();
}

document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  var res = await client.auth.signInWithPassword({ email: email, password: password });
  if (res.error) { showLogin(res.error.message); return; }
  if (!isCoach(res.data.session)) {
    await client.auth.signOut();
    showLogin('Dieses Konto ist nicht als Coach freigeschaltet.');
    return;
  }
  showApp();
});

document.getElementById('logoutBtn').addEventListener('click', async function () {
  await client.auth.signOut();
  window.location.reload();
});

async function loadAll() {
  var [coursesRes, teachersRes, modulesRes, cmRes, progRes] = await Promise.all([
    client.from('courses').select('id,name').order('name'),
    client.from('teachers').select('id,name,login_code,course_id,active').order('name'),
    client.from('modules').select('id,key,title,sort_order').order('sort_order'),
    client.from('course_modules').select('course_id,module_id,visible'),
    client.from('progress').select('teacher_id,module_id,state,updated_at'),
  ]);
  db.courses = coursesRes.data || [];
  db.teachers = teachersRes.data || [];
  db.modules = modulesRes.data || [];
  db.courseModules = cmRes.data || [];
  db.progress = progRes.data || [];

  renderCourses();
  renderTeacherCourseSelect();
  renderTeachers();
  renderVisibilityMatrix();
  renderProgress();
}

/* ---------- Kurse ---------- */
function renderCourses() {
  var grid = document.getElementById('coursesGrid');
  var countEl = document.getElementById('courseCount');
  var filter = document.getElementById('courseFilter').value.trim().toLowerCase();
  var list = db.courses.filter(function (c) {
    return !filter || c.name.toLowerCase().indexOf(filter) !== -1;
  });

  countEl.textContent = db.courses.length === 0 ? '' :
    (filter ? list.length + ' von ' + db.courses.length : db.courses.length) +
    (db.courses.length === 1 && !filter ? ' Kurs' : ' Kurse');

  grid.innerHTML = list.map(function (c) {
    var count = db.teachers.filter(function (t) { return t.course_id === c.id; }).length;
    return '<div class="course-card" data-id="' + c.id + '">' +
      '<input type="text" class="nameEdit courseNameEdit" title="' + esc(c.name) + '" value="' + esc(c.name) + '">' +
      '<span class="badge open">' + count + ' Lehrkraft' + (count === 1 ? '' : 'kräfte') + '</span>' +
      '</div>';
  }).join('') || '<p class="muted">' + (filter ? 'Keine Kurse gefunden.' : 'Noch keine Kurse.') + '</p>';

  grid.querySelectorAll('.course-card').forEach(function (card) {
    var id = card.dataset.id;
    var input = card.querySelector('.courseNameEdit');
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') input.blur();
    });
    input.addEventListener('blur', async function () {
      var name = input.value.trim();
      if (!name || name === (db.courses.find(function (c) { return c.id === id; }) || {}).name) {
        input.value = (db.courses.find(function (c) { return c.id === id; }) || {}).name || '';
        return;
      }
      await client.from('courses').update({ name: name }).eq('id', id);
      loadAll();
    });
  });
}
document.getElementById('courseFilter').addEventListener('input', renderCourses);

document.getElementById('courseForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var input = document.getElementById('courseName');
  var name = input.value.trim();
  if (!name) return;
  await client.from('courses').insert({ name: name });
  input.value = '';
  loadAll();
});

/* ---------- Lehrkräfte ---------- */
function renderTeacherCourseSelect() {
  var sel = document.getElementById('teacherCourse');
  sel.innerHTML = db.courses.map(function (c) {
    return '<option value="' + c.id + '">' + esc(c.name) + '</option>';
  }).join('') || '<option value="">(zuerst Kurs anlegen)</option>';
}

function renderTeachers() {
  var tbody = document.getElementById('teachersTable');
  tbody.innerHTML = db.teachers.map(function (t) {
    var courseOptions = db.courses.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === t.course_id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('');
    return '<tr data-id="' + t.id + '">' +
      '<td><input type="text" class="nameEdit teacherNameEdit" value="' + esc(t.name) + '"></td>' +
      '<td><code class="token">' + esc(t.login_code) + '</code></td>' +
      '<td><select class="teacherCourseSelect">' + courseOptions + '</select></td>' +
      '<td><input type="checkbox" class="teacherActive" ' + (t.active ? 'checked' : '') + '></td>' +
      '<td><button class="ghost teacherDelete" type="button">Entfernen</button></td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="5" class="muted">Noch keine Lehrkräfte.</td></tr>';

  tbody.querySelectorAll('tr').forEach(function (row) {
    var id = row.dataset.id;
    var nameInput = row.querySelector('.teacherNameEdit');
    nameInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') nameInput.blur();
    });
    nameInput.addEventListener('blur', async function () {
      var name = nameInput.value.trim();
      if (!name || name === (db.teachers.find(function (t2) { return t2.id === id; }) || {}).name) {
        nameInput.value = (db.teachers.find(function (t2) { return t2.id === id; }) || {}).name || '';
        return;
      }
      await client.from('teachers').update({ name: name }).eq('id', id);
      loadAll();
    });
    row.querySelector('.teacherCourseSelect').addEventListener('change', async function (e) {
      await client.from('teachers').update({ course_id: e.target.value }).eq('id', id);
      loadAll();
    });
    row.querySelector('.teacherActive').addEventListener('change', async function (e) {
      await client.from('teachers').update({ active: e.target.checked }).eq('id', id);
    });
    row.querySelector('.teacherDelete').addEventListener('click', async function () {
      if (!confirm('Diese Lehrkraft wirklich entfernen? Der Fortschritt geht dabei verloren.')) return;
      await client.from('teachers').delete().eq('id', id);
      loadAll();
    });
  });
}

var PRINT_DOMAIN = 'cpd.fels-schule.de';

function renderPrintCodes() {
  var wrap = document.getElementById('printCodes');
  var courseName = {};
  db.courses.forEach(function (c) { courseName[c.id] = c.name; });

  var teachers = db.teachers.slice().sort(function (a, b) {
    var ca = courseName[a.course_id] || '';
    var cb = courseName[b.course_id] || '';
    if (ca !== cb) return ca < cb ? -1 : 1;
    return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
  });

  var cards = teachers.map(function (t) {
    return '<div class="code-card">' +
      '<span class="course">' + esc(courseName[t.course_id] || '–') + '</span>' +
      '<span class="name">' + esc(t.name) + '</span>' +
      '<span class="code">' + esc(t.login_code) + '</span>' +
      '<span class="url">' + esc(PRINT_DOMAIN) + '</span>' +
      (t.active ? '' : '<span class="inactive-note">Account deaktiviert</span>') +
      '</div>';
  }).join('');

  wrap.innerHTML =
    '<div class="print-head">' +
      '<h1>CPD Fortbildung · Zugangscodes</h1>' +
      '<p>Anmeldung unter ' + esc(PRINT_DOMAIN) + ' &middot; Stand: ' + esc(new Date().toLocaleDateString('de-DE')) + '</p>' +
    '</div>' +
    '<div class="code-grid">' + (cards || '<p>Noch keine Lehrkräfte angelegt.</p>') + '</div>';
}

document.getElementById('printCodesBtn').addEventListener('click', function () {
  renderPrintCodes();
  window.print();
});

function generateCode() {
  var alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // ohne 0/O/1/I/L zur besseren Lesbarkeit
  var bytes = new Uint8Array(6);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(function (b) { return alphabet[b % alphabet.length]; }).join('');
}

document.getElementById('teacherForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var nameInput = document.getElementById('teacherName');
  var courseId = document.getElementById('teacherCourse').value;
  var name = nameInput.value.trim();
  if (!name || !courseId) return;

  var msg = document.getElementById('teacherMsg');
  var code, res, attempts = 0;
  do {
    code = generateCode();
    res = await client.from('teachers').insert({ name: name, login_code: code, course_id: courseId }).select().single();
    attempts++;
  } while (res.error && res.error.code === '23505' && attempts < 5);

  if (res.error) {
    msg.className = 'msg error';
    msg.textContent = 'Fehler beim Anlegen: ' + res.error.message;
  } else {
    msg.className = 'msg';
    msg.style.background = 'var(--petrol-soft)';
    msg.style.color = 'var(--petrol)';
    msg.innerHTML = esc(name) + ' angelegt. Zugangscode: <code class="token">' + esc(code) + '</code>';
  }
  msg.classList.remove('hidden');
  nameInput.value = '';
  loadAll();
});

/* ---------- Modul-Matrizen (Sichtbarkeit & Fortschritt) ---------- */
function moduleHeaderCell(m, colToggle) {
  var shortMatch = m.key.match(/^modul([0-9a-z]+)-/i);
  var short = shortMatch ? shortMatch[1] : String(m.sort_order);
  var full = m.title.replace(/^Modul \d+ · /, '');
  var toggle = colToggle ? '<input type="checkbox" class="colToggleAll" data-module="' + m.id + '" title="Modul für alle Kurse an-/abwählen">' : '';
  return '<th title="' + esc(full) + '">' + toggle + '<abbr>W' + esc(short) + '</abbr></th>';
}

/* ---------- Sichtbarkeit ---------- */
function updateColToggleState(wrap, moduleId) {
  var colBox = wrap.querySelector('.colToggleAll[data-module="' + moduleId + '"]');
  if (!colBox) return;
  var rowBoxes = wrap.querySelectorAll('.visToggle[data-module="' + moduleId + '"]');
  var checkedCount = 0;
  rowBoxes.forEach(function (rb) { if (rb.checked) checkedCount++; });
  colBox.checked = checkedCount > 0 && checkedCount === rowBoxes.length;
  colBox.indeterminate = checkedCount > 0 && checkedCount < rowBoxes.length;
}

function renderVisibilityMatrix() {
  var wrap = document.getElementById('visibilityWrap');
  if (db.courses.length === 0 || db.modules.length === 0) {
    wrap.innerHTML = '<p class="muted">Zuerst einen Kurs anlegen.</p>';
    return;
  }
  var visMap = {};
  db.courseModules.forEach(function (cm) { visMap[cm.course_id + ':' + cm.module_id] = cm.visible; });

  var html = '<div class="matrix-scroll"><table class="matrix"><thead><tr><th class="rowhead">Kurs</th>' +
    db.modules.map(function (m) { return moduleHeaderCell(m, true); }).join('') +
    '</tr></thead><tbody>';
  db.courses.forEach(function (c) {
    html += '<tr><td class="rowhead">' + esc(c.name) + '</td>';
    db.modules.forEach(function (m) {
      var checked = !!visMap[c.id + ':' + m.id];
      html += '<td><input type="checkbox" class="visToggle" data-course="' + c.id + '" data-module="' + m.id + '"' + (checked ? ' checked' : '') + '></td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('.visToggle').forEach(function (box) {
    box.addEventListener('change', async function (e) {
      var moduleId = e.target.dataset.module;
      await client.from('course_modules').upsert({
        course_id: e.target.dataset.course,
        module_id: moduleId,
        visible: e.target.checked,
      }, { onConflict: 'course_id,module_id' });
      db.courseModules = (await client.from('course_modules').select('course_id,module_id,visible')).data || [];
      updateColToggleState(wrap, moduleId);
    });
  });

  wrap.querySelectorAll('.colToggleAll').forEach(function (colBox) {
    var moduleId = colBox.dataset.module;
    updateColToggleState(wrap, moduleId);
    colBox.addEventListener('change', async function (e) {
      var newVal = e.target.checked;
      var rowBoxes = wrap.querySelectorAll('.visToggle[data-module="' + moduleId + '"]');
      rowBoxes.forEach(function (rb) { rb.checked = newVal; });
      await Promise.all(Array.from(rowBoxes).map(function (rb) {
        return client.from('course_modules').upsert({
          course_id: rb.dataset.course,
          module_id: moduleId,
          visible: newVal,
        }, { onConflict: 'course_id,module_id' });
      }));
      db.courseModules = (await client.from('course_modules').select('course_id,module_id,visible')).data || [];
      e.target.indeterminate = false;
    });
  });
}

/* ---------- Fortschritt ---------- */
function statusFor(state) {
  if (!state || typeof state !== 'object') return { cls: 'open', label: 'offen' };
  if (state.submitted) return { cls: 'done', label: '✓ eingereicht' };
  if (state.screen && state.screen > 0) return { cls: 'progress', label: 'in Bearbeitung' };
  return { cls: 'open', label: 'offen' };
}

function moduleFullyDone(m, progMap) {
  return db.teachers.every(function (t) {
    var entry = progMap[t.id + ':' + m.id];
    return !!(entry && entry.state && entry.state.submitted);
  });
}

function renderProgress() {
  var wrap = document.getElementById('progressWrap');
  if (db.teachers.length === 0 || db.modules.length === 0) {
    wrap.innerHTML = '<p class="muted">Noch keine Lehrkräfte oder Module.</p>';
    return;
  }
  var progMap = {};
  db.progress.forEach(function (p) { progMap[p.teacher_id + ':' + p.module_id] = p; });
  var courseName = {};
  db.courses.forEach(function (c) { courseName[c.id] = c.name; });

  var hideDone = document.getElementById('hideDoneModules').checked;
  var modules = hideDone ? db.modules.filter(function (m) { return !moduleFullyDone(m, progMap); }) : db.modules;

  if (modules.length === 0) {
    wrap.innerHTML = '<p class="muted">Alle Module wurden von allen Lehrkräften eingereicht.</p>';
    return;
  }

  var html = '<div class="matrix-scroll"><table class="matrix"><thead><tr><th class="rowhead">Lehrkraft</th>' +
    modules.map(function (m) { return moduleHeaderCell(m); }).join('') +
    '</tr></thead><tbody>';
  db.teachers.forEach(function (t) {
    html += '<tr><td class="rowhead">' + esc(t.name) +
      '<span class="sub">' + esc(courseName[t.course_id] || '–') + '</span></td>';
    modules.forEach(function (m) {
      var entry = progMap[t.id + ':' + m.id];
      var st = statusFor(entry && entry.state);
      var title = entry ? 'Zuletzt aktualisiert: ' + new Date(entry.updated_at).toLocaleString('de-DE') : '';
      if (entry) {
        html += '<td><button type="button" class="cell-open" data-teacher="' + t.id + '" data-module="' + m.id + '">' +
          '<span class="badge ' + st.cls + '" title="' + esc(title) + '">' + st.label + '</span></button></td>';
      } else {
        html += '<td><span class="badge ' + st.cls + '">' + st.label + '</span></td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('.cell-open').forEach(function (btn) {
    btn.addEventListener('click', function () {
      openAnswers(btn.dataset.teacher, btn.dataset.module);
    });
  });
}
document.getElementById('hideDoneModules').addEventListener('change', renderProgress);

/* ---------- Antworten-Ansicht ---------- */
function openAnswers(teacherId, moduleId) {
  var teacher = db.teachers.find(function (t) { return t.id === teacherId; });
  var module = db.modules.find(function (m) { return m.id === moduleId; });
  var entry = db.progress.find(function (p) { return p.teacher_id === teacherId && p.module_id === moduleId; });
  if (!teacher || !module || !entry) return;
  var state = entry.state || {};

  document.getElementById('answersTitle').textContent = teacher.name + ' · ' + module.title;

  var statusEl = document.getElementById('answersStatus');
  if (state.submitted && state.submittedAt) {
    statusEl.className = 'msg';
    statusEl.style.background = 'var(--petrol-soft)';
    statusEl.style.color = 'var(--petrol)';
    statusEl.textContent = '✓ Eingereicht am ' + new Date(state.submittedAt).toLocaleString('de-DE');
  } else {
    statusEl.className = 'msg';
    statusEl.style.background = '#FCEFD9';
    statusEl.style.color = 'var(--amber)';
    statusEl.textContent = 'Entwurf – noch nicht eingereicht. Zuletzt bearbeitet: ' + new Date(entry.updated_at).toLocaleString('de-DE');
  }
  statusEl.classList.remove('hidden');

  var body = document.getElementById('answersBody');
  body.textContent = state.submissionText ||
    'Noch keine Zusammenfassung verfügbar – die Lehrkraft hat das Modul noch nicht bis zur letzten Station bearbeitet.';
  body.classList.remove('hidden');

  document.getElementById('answersOverlay').classList.remove('hidden');
}
document.getElementById('answersOverlay').addEventListener('click', function (e) {
  if (e.target === e.currentTarget) closeAnswers();
});
document.getElementById('answersClose').addEventListener('click', closeAnswers);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeAnswers();
});
function closeAnswers() {
  document.getElementById('answersOverlay').classList.add('hidden');
}

/* ---------- Passwort ändern ---------- */
function openPasswordDialog() {
  document.getElementById('passwordForm').reset();
  var msg = document.getElementById('passwordMsg');
  msg.className = 'msg hidden';
  msg.textContent = '';
  document.getElementById('passwordOverlay').classList.remove('hidden');
}
function closePasswordDialog() {
  document.getElementById('passwordOverlay').classList.add('hidden');
}
document.getElementById('changePasswordBtn').addEventListener('click', openPasswordDialog);
document.getElementById('passwordClose').addEventListener('click', closePasswordDialog);
document.getElementById('passwordOverlay').addEventListener('click', function (e) {
  if (e.target === e.currentTarget) closePasswordDialog();
});

document.getElementById('passwordForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var msg = document.getElementById('passwordMsg');
  var pw = document.getElementById('newPassword').value;
  var pwRepeat = document.getElementById('newPasswordRepeat').value;

  function showMsg(text, isError) {
    msg.className = 'msg' + (isError ? ' error' : '');
    if (!isError) { msg.style.background = 'var(--petrol-soft)'; msg.style.color = 'var(--petrol)'; }
    msg.textContent = text;
    msg.classList.remove('hidden');
  }

  if (pw.length < 8) { showMsg('Das Passwort muss mindestens 8 Zeichen lang sein.', true); return; }
  if (pw !== pwRepeat) { showMsg('Die beiden Passwörter stimmen nicht überein.', true); return; }

  var res = await client.auth.updateUser({ password: pw });
  if (res.error) {
    showMsg('Fehler: ' + res.error.message, true);
    return;
  }
  showMsg('Passwort erfolgreich geändert.', false);
  document.getElementById('passwordForm').reset();
  setTimeout(closePasswordDialog, 1200);
});

boot();
</script>
</body>
</html>
