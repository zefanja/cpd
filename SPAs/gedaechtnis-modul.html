<!-- Selbstlern-Modul: Gedächtnismodell, CLT, Spacing -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie Lernen im Kopf funktioniert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe6; --paper2:#ece4d6; --card:#fbf8f1; --ink:#221f1a; --muted:#6f665a;
    --line:#dbd1bf; --sensory:#2f6fb3; --working:#2f8a5b; --longterm:#6a51c4;
    --correct:#2f7d52; --correct-bg:#e6f1e8; --wrong:#b1462c; --wrong-bg:#f6e6e0;
    --accent:#bc6a2a; --shadow:0 1px 0 #fff inset, 0 10px 30px -18px rgba(40,32,20,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 18% 0%, rgba(106,81,196,.05), transparent 45%),
      radial-gradient(circle at 90% 8%, rgba(47,138,91,.05), transparent 40%);
    min-height:100vh;
  }
  .wrap{max-width:780px;margin:0 auto;padding:28px 20px 80px}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .dot{width:11px;height:11px;border-radius:50%}
  .kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .progress{margin:16px 0 26px}
  .bar{height:7px;background:var(--paper2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--working),var(--longterm));transition:width .5s cubic-bezier(.4,1.2,.4,1)}
  .progress small{display:block;margin-top:7px;color:var(--muted);font-size:.8rem}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:30px 30px 26px;box-shadow:var(--shadow);animation:rise .45s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:2.05rem;line-height:1.12;margin:.1em 0 .35em}
  h2{font-family:"Fraunces",serif;font-weight:600;font-size:1.5rem;margin:.1em 0 .55em;line-height:1.2}
  h3{font-family:"Hanken Grotesk";font-weight:700;font-size:1.02rem;margin:1.3em 0 .4em}
  p{margin:.55em 0}
  .lead{font-size:1.06rem;color:#3a352d}
  ul.clean{list-style:none;padding:0;margin:.6em 0}
  ul.clean li{position:relative;padding:.28em 0 .28em 1.4em;border-bottom:1px dashed var(--line)}
  ul.clean li:last-child{border-bottom:0}
  ul.clean li::before{content:"";position:absolute;left:2px;top:.95em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:99px;vertical-align:middle}
  .tag.s{background:rgba(47,111,179,.13);color:var(--sensory)}
  .tag.w{background:rgba(47,138,91,.14);color:var(--working)}
  .tag.l{background:rgba(106,81,196,.13);color:var(--longterm)}
  .note{font-size:.86rem;color:var(--muted);background:var(--paper2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;margin:1.1em 0}
  figure{margin:1.3em 0;text-align:center}
  figure svg{max-width:100%;height:auto}
  figcaption{font-size:.82rem;color:var(--muted);margin-top:.5em}
  .qmeta{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:.2em}
  .qprompt{font-size:1.18rem;font-weight:600;font-family:"Fraunces",serif;margin:.1em 0 1em;line-height:1.3}
  .opts{display:flex;flex-direction:column;gap:10px;margin:0 0 6px}
  .opt{
    text-align:left;font:inherit;color:inherit;background:var(--paper);
    border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;
    transition:border-color .15s,background .15s,transform .08s;display:flex;gap:11px;align-items:flex-start;
  }
  .opt:hover{border-color:var(--accent)}
  .opt:active{transform:scale(.995)}
  .opt .box{flex:0 0 auto;width:20px;height:20px;border:2px solid var(--line);border-radius:6px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff}
  .opt.multi .box{border-radius:6px}
  .opt.sel{border-color:var(--accent);background:#fff}
  .opt.sel .box{background:var(--accent);border-color:var(--accent)}
  .opt.right{border-color:var(--correct);background:var(--correct-bg)}
  .opt.right .box{background:var(--correct);border-color:var(--correct)}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
  .opt.wrong .box{background:var(--wrong);border-color:var(--wrong)}
  .opt[disabled]{cursor:default}
  .opt .exp{display:block;font-size:.85rem;color:var(--muted);margin-top:5px;line-height:1.45}
  .opt .otext{font-weight:500}
  /* order + match */
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 14px}
  .chip{font:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:8px 15px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent)}
  .chip.used{opacity:.35;pointer-events:none}
  .seq{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px;min-height:8px}
  .seqitem{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;cursor:pointer}
  .seqitem .n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:center}
  .seqitem.right{border-color:var(--correct);background:var(--correct-bg)}
  .seqitem.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
  .matchrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px;flex-wrap:wrap}
  .matchrow .ml{font-weight:600;flex:1 1 auto;min-width:160px}
  .matchrow select{font:inherit;padding:8px 11px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:inherit;min-width:170px}
  .matchrow.right{border-color:var(--correct);background:var(--correct-bg)}
  .matchrow.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
  .feedback{margin:14px 0 2px;padding:13px 16px;border-radius:12px;font-size:.94rem;animation:rise .3s ease both}
  .feedback.ok{background:var(--correct-bg);border:1px solid var(--correct);color:#1f5638}
  .feedback.no{background:var(--wrong-bg);border:1px solid var(--wrong);color:#7e3019}
  .feedback strong{font-weight:700}
  .feedback .why{margin-top:7px;font-size:.88rem;color:#4a443b}
  .row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
  button.btn{
    font:inherit;font-weight:600;border:none;border-radius:11px;padding:13px 24px;cursor:pointer;transition:.15s;
    background:var(--ink);color:var(--paper);box-shadow:0 8px 18px -10px rgba(34,31,26,.8);
  }
  button.btn:hover{transform:translateY(-1px)}
  button.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  button.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1.5px solid var(--line)}
  button.ghost:hover{border-color:var(--accent);color:var(--ink)}
  .check{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:11px;padding:11px 22px;cursor:pointer}
  .check[disabled]{opacity:.4;cursor:not-allowed}
  textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff;color:inherit;resize:vertical;min-height:90px}
  .reflq{font-weight:600;margin:18px 0 6px;font-family:"Fraunces",serif;font-size:1.05rem}
  .report-q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:14px 0;background:var(--paper)}
  .report-q .rp{font-weight:600;font-family:"Fraunces",serif;margin-bottom:4px}
  .report-q .ans{font-size:.92rem;margin:7px 0}
  .report-q .ans .lab{font-weight:700}
  .report-q .ans.r{color:#1f5638}
  .report-q .ans.x{color:#7e3019}
  .report-q .ans .why{color:var(--muted);font-size:.86rem}
  .celebrate{text-align:center;padding:8px 0}
  .celebrate .big{font-family:"Fraunces",serif;font-size:3.2rem;font-weight:600;background:linear-gradient(90deg,var(--working),var(--longterm));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
  .hidden{display:none}
  @media(max-width:560px){.card{padding:24px 18px 22px}h1{font-size:1.7rem}.qprompt{font-size:1.06rem}}
</style>

<div class="wrap">
  <header class="top">
    <span class="dot" style="background:var(--sensory)"></span>
    <span class="dot" style="background:var(--working)"></span>
    <span class="dot" style="background:var(--longterm)"></span>
    <span class="kicker">Fachschaft Mathematik · Selbstlern-Modul</span>
  </header>
  <div class="progress">
    <div class="bar"><i id="barfill"></i></div>
    <small id="barlabel">0 von 11 Aufgaben gemeistert</small>
  </div>
  <div id="app"></div>
</div>

<script>
/* ---------- helper ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ---------- SVG sketches ---------- */
const SVG_MODEL = `

    <text x="150" y="192" text-anchor="middle" font-family="Fraunces,serif" font-size="17" font-weight="600" fill="#2f6fb3">Gedächtnis</text>
    <rect x="360" y="120" width="180" height="110" rx="18" fill="rgba(47,138,91,.10)" stroke="#2f8a5b" stroke-width="2"/>
    <text x="450" y="170" text-anchor="middle" font-family="Fraunces,serif" font-size="17" font-weight="600" fill="#2f8a5b">Arbeits-</text>
    <text x="450" y="192" text-anchor="middle" font-family="Fraunces,serif" font-size="17" font-weight="600" fill="#2f8a5b">gedächtnis</text>
    <rect x="660" y="120" width="180" height="110" rx="18" fill="rgba(106,81,196,.10)" stroke="#6a51c4" stroke-width="2"/>
    <text x="750" y="170" text-anchor="middle" font-family="Fraunces,serif" font-size="17" font-weight="600" fill="#6a51c4">Langzeit-</text>
    <text x="750" y="192" text-anchor="middle" font-family="Fraunces,serif" font-size="17" font-weight="600" fill="#6a51c4">gedächtnis</text>
  </g>
  <!-- stimulus -->
  <path d="M12,175 H56" stroke="#221f1a" stroke-width="2.5" marker-end="url(#ar)" fill="none"/>
  <text x="34" y="160" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="12" fill="#6f665a">Reiz</text>
  <!-- attention -->
  <path d="M244,175 H356" stroke="#221f1a" stroke-width="2.5" marker-end="url(#ar)" fill="none"/>
  <text x="300" y="163" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="13" font-weight="600" fill="#221f1a">Aufmerksamkeit</text>
  <!-- encoding -->
  <path d="M544,160 H656" stroke="#221f1a" stroke-width="2.5" marker-end="url(#ar)" fill="none"/>
  <text x="600" y="150" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="13" font-weight="600" fill="#221f1a">Enkodierung</text>
  <!-- retrieval -->
  <path d="M656,200 H548" stroke="#221f1a" stroke-width="2.5" marker-end="url(#ar)" fill="none"/>
  <text x="600" y="222" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="13" font-weight="600" fill="#221f1a">Abruf</text>
  <!-- loss -->
  <path d="M150,234 V282" stroke="#6f665a" stroke-width="2" marker-end="url(#arm)" fill="none"/>
  <text x="150" y="302" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="12" fill="#6f665a">Verlust</text>
  <path d="M450,234 V282" stroke="#6f665a" stroke-width="2" marker-end="url(#arm)" fill="none"/>
  <text x="450" y="302" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="12" fill="#6f665a">Verlust</text>
  <path d="M750,234 V282" stroke="#6f665a" stroke-width="2" marker-end="url(#arm)" fill="none"/>
  <text x="750" y="302" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="12" fill="#6f665a">Verlust?</text>

const SVG_CHUNK = `
<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chunking: lose Einzelteile gegen ein Schema">
  <text x="190" y="28" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="14" font-weight="700" fill="#b1462c">Ohne Schema: viele Einzelteile</text>
  <rect x="40" y="44" width="300" height="200" rx="16" fill="rgba(177,70,44,.06)" stroke="#b1462c" stroke-width="2"/>
  <text x="190" y="232" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="12" fill="#6f665a">Arbeitsgedächtnis ist überfüllt</text>

const SVG_CURVE = `

/* ---------- content steps ---------- */
const steps = [
  {type:"intro"},
  {type:"teach", id:"t2", title:"Das Modell: drei Speicher", svg:SVG_MODEL,
   caption:"Eine aktualisierte Fassung des modalen Gedächtnismodells.",
   html:`
    <p class="lead">Das Bild zeigt eine aktualisierte Fassung des <em>modalen Gedächtnismodells</em> (ursprünglich Atkinson &amp; Shiffrin, 1968). Es unterscheidet drei Speicher:</p>
    <ul class="clean">
      <li><span class="tag s">sensorisch</span> Nimmt alle Reize auf, hält sie aber nur sehr kurz &ndash; das meiste geht sofort verloren.</li>
      <li><span class="tag w">Arbeit</span> Hier denkst du bewusst. Stark begrenzt in der <strong>Menge</strong> (je nach Quelle und Definition etwa 4&ndash;7 Einheiten/&bdquo;chunks&ldquo;) und in der <strong>Dauer</strong> (Sekunden, wenn nicht aktiv wiederholt wird).</li>
      <li><span class="tag l">Langzeit</span> Praktisch unbegrenzt und dauerhaft.</li>
    </ul>
    <h3>Die Pfeile sind entscheidend</h3>
    <ul class="clean">
      <li><strong>Aufmerksamkeit</strong> entscheidet, was es vom sensorischen ins Arbeitsgedächtnis schafft.</li>
      <li><strong>Enkodierung</strong> überführt Inhalte ins Langzeitgedächtnis.</li>
      <li><strong>Abruf</strong> holt Wissen zurück ins Arbeitsgedächtnis.</li>
      <li><strong>Modulation</strong> &ndash; Vorwissen, Emotion, Aufmerksamkeitssteuerung &ndash; beeinflusst alle Übergänge.</li>
    </ul>
    <div class="note">Das &bdquo;Verlust?&ldquo; mit Fragezeichen am Langzeitgedächtnis ist Absicht: Es ist umstritten, ob Inhalte dort wirklich <em>gelöscht</em> werden &ndash; oder ob &bdquo;Vergessen&ldquo; eher ein <em>Abrufproblem</em> ist. (Die Kapazitätszahl 4&ndash;7 ist quellenabhängig &ndash; bewusst als Spanne angegeben.)</div>`},

  {type:"q", id:"F1", section:1, qtype:"order",
   prompt:"Bring die Stationen in die richtige Reihenfolge. Klick die Bausteine in der Reihenfolge an, in der Information sie durchläuft.",
   items:[
     {key:"a",text:"Sensorischer Reiz"},
     {key:"b",text:"Sensorisches Gedächtnis"},
     {key:"c",text:"Aufmerksamkeit"},
     {key:"d",text:"Arbeitsgedächtnis"},
     {key:"e",text:"Enkodierung"},
     {key:"f",text:"Langzeitgedächtnis"}],
   order:["a","b","c","d","e","f"],
   explain:"Reize treffen zuerst das sensorische Gedächtnis. Nur was Aufmerksamkeit bekommt, gelangt ins Arbeitsgedächtnis. Von dort führt die Enkodierung ins Langzeitgedächtnis."},

  {type:"q", id:"F2", section:1, qtype:"single",
   prompt:"Welcher Prozess entscheidet, ob ein Reiz ins Arbeitsgedächtnis gelangt?",
   options:[
     {key:"a",text:"Aufmerksamkeit",correct:true,exp:"Richtig &ndash; im Modell ist genau dies der Pfeil vom sensorischen ins Arbeitsgedächtnis. Was keine Aufmerksamkeit bekommt, geht verloren."},

    <ul class="clean">

/* ---------- state ---------- */
let cur = 0;
const state = {}; // id -> {done:true}
const reflectAnswers = ["","",""];
const gatedIds = steps.filter(s=>s.type==="q").map(s=>s.id);

function updateProgress(){
  const done = gatedIds.filter(id=>state[id] && state[id].done).length;
  document.getElementById("barfill").style.width = (done/gatedIds.length*100)+"%";
  document.getElementById("barlabel").textContent = done+" von "+gatedIds.length+" Aufgaben gemeistert";
}

const app = document.getElementById("app");
function go(n){cur=n;render();window.scrollTo({top:0,behavior:"smooth"});}

/* ---------- render ---------- */
function render(){
  const s = steps[cur];
  if(s.type==="intro") return renderIntro();
  if(s.type==="teach") return renderTeach(s);
  if(s.type==="q") return renderQuestion(s);
  if(s.type==="reflect") return renderReflect(s);
  if(s.type==="report") return renderReport();
}

function renderIntro(){
  app.innerHTML = `<div class="card">
    <h1>Wie Lernen im Kopf funktioniert</h1>
    <p class="lead">Diese rund 15 Minuten bereiten unsere nächste Fachschaftssitzung vor. Du liest drei kurze Abschnitte und prüfst dein Verständnis mit kleinen Aufgaben.</p>
    <ul class="clean">
      <li>Es gibt kein &bdquo;Bestehen&ldquo; und keine Auswertung für andere &ndash; das <strong>Ziel sind 100&nbsp;% für dich selbst</strong>.</li>
      <li>Du kommst <strong>erst weiter, wenn eine Aufgabe richtig</strong> gelöst ist. Bei jedem Versuch wechselt die <strong>Reihenfolge der Antworten</strong>.</li>
      <li>Zu jeder Option erfährst du, <strong>warum sie richtig oder falsch</strong> ist &ndash; sofort und im Report am Ende.</li>
    </ul>
    <div class="row"><span></span><button class="btn" id="next">Los geht&rsquo;s</button></div>
  </div>`;
  document.getElementById("next").onclick=()=>go(cur+1);
}

function renderTeach(s){
  app.innerHTML = `<div class="card">
    <div class="qmeta">Lesen</div>
    <h2>${s.title}</h2>
    ${s.html}
    <figure>${s.svg}<figcaption>${s.caption}</figcaption></figure>
    <div class="row">
      <button class="ghost" id="back">Zurück</button>
      <button class="btn" id="next">Verstanden &ndash; zu den Fragen</button>
    </div>
  </div>`;
  document.getElementById("next").onclick=()=>go(cur+1);
  document.getElementById("back").onclick=()=>go(cur-1);
}

function sectionLabel(n){return {1:"Das Modell",2:"Cognitive Load",3:"Behalten &amp; Wiederholen"}[n]||"";}

function renderQuestion(s){
  const solved = state[s.id] && state[s.id].done;
  app.innerHTML = `<div class="card">
    <div class="qmeta">${s.id} &middot; ${sectionLabel(s.section)}</div>
    <div class="qprompt">${s.prompt}</div>
    <div id="qbody"></div>
    <div id="fb"></div>
    <div class="row">
      <button class="ghost" id="back">Zurück</button>
      <div style="display:flex;gap:10px">
        <button class="check" id="check">Prüfen</button>
        <button class="btn" id="next" ${solved?"":"disabled"}>Weiter</button>
      </div>
    </div>
  </div>`;
  document.getElementById("back").onclick=()=>go(cur-1);
  document.getElementById("next").onclick=()=>go(cur+1);

  if(s.qtype==="single"||s.qtype==="multi") buildChoice(s);
  else if(s.qtype==="order") buildOrder(s);
  else if(s.qtype==="match") buildMatch(s);

  if(solved){ revealSolved(s); }
}

/* ----- choice (single / multi) ----- */
function buildChoice(s){
  const body=document.getElementById("qbody");
  const opts=shuffle(s.options);
  let sel=new Set();
  const multi=s.qtype==="multi";
  body.innerHTML=`<div class="opts">${opts.map(o=>`
    <button class="opt ${multi?"multi":""}" data-k="${o.key}">
      <span class="box"></span><span class="otext">${o.text}</span>
    </button>`).join("")}</div>${multi?'<small style="color:var(--muted)">Mehrfachauswahl &ndash; dann auf &bdquo;Prüfen&ldquo;.</small>':""}`;
  body.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.k;
      if(multi){ if(sel.has(k)){sel.delete(k);b.classList.remove("sel");b.querySelector(".box").textContent="";} else {sel.add(k);b.classList.add("sel");b.querySelector(".box").textContent="\u2713";} }
      else { sel=new Set([k]); body.querySelectorAll(".opt").forEach(x=>{x.classList.remove("sel");x.querySelector(".box").textContent="";}); b.classList.add("sel"); b.querySelector(".box").textContent="\u2713"; }
    };
  });
  document.getElementById("check").onclick=()=>{
    if(sel.size===0){flash("Bitte zuerst etwas auswählen.");return;}
    const correctKeys=new Set(s.options.filter(o=>o.correct).map(o=>o.key));
    const ok = sel.size===correctKeys.size && [...sel].every(k=>correctKeys.has(k));
    const fb=document.getElementById("fb");
    body.querySelectorAll(".opt").forEach(b=>{
      const o=s.options.find(x=>x.key===b.dataset.k);
      const chosen=sel.has(b.dataset.k);
      b.setAttribute("disabled","");
      if(ok){ // reveal everything when correct
        b.classList.remove("sel"); b.querySelector(".box").textContent = o.correct?"\u2713":"";
        if(o.correct) b.classList.add("right");
        b.insertAdjacentHTML("beforeend",`<span class="exp">${o.exp}</span>`);
      } else {
        if(chosen){ b.classList.remove("sel"); b.classList.add(o.correct?"right":"wrong"); b.querySelector(".box").textContent=o.correct?"\u2713":"\u2717";
          b.insertAdjacentHTML("beforeend",`<span class="exp">${o.exp}</span>`);}
      }
    });
    if(ok){ markDone(s,fb); }
    else { fb.innerHTML=`<div class="feedback no"><strong>Noch nicht ganz.</strong> Schau dir die markierte(n) Antwort(en) an und versuch es erneut &ndash; die Reihenfolge wird neu gemischt.</div>`;
      addRetry(s); document.getElementById("check").setAttribute("disabled",""); }
  };
}

/* ----- order ----- */
function buildOrder(s){
  const body=document.getElementById("qbody");
  const pool=shuffle(s.items);
  let placed=[];
  function draw(){
    body.innerHTML=`
      <div class="chips">${pool.map(it=>`<button class="chip ${placed.includes(it.key)?"used":""}" data-k="${it.key}">${it.text}</button>`).join("")}</div>
      <div class="seq" id="seq">${placed.map((k,i)=>{const it=s.items.find(x=>x.key===k);return `<div class="seqitem" data-k="${k}"><span class="n">${i+1}</span><span>${it.text}</span></div>`;}).join("")||'<small style="color:var(--muted)">Klick die Bausteine in der richtigen Reihenfolge an.</small>'}</div>`;
    body.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{if(!placed.includes(c.dataset.k)){placed.push(c.dataset.k);draw();}});
    body.querySelectorAll(".seqitem").forEach(si=>si.onclick=()=>{placed=placed.filter(k=>k!==si.dataset.k);draw();});
  }
  draw();
  document.getElementById("check").onclick=()=>{
    if(placed.length!==s.items.length){flash("Bitte alle Bausteine einsortieren.");return;}
    const ok=placed.every((k,i)=>k===s.order[i]);
    const fb=document.getElementById("fb");
    const seq=document.getElementById("seq");
    [...seq.children].forEach((el,i)=>{el.classList.add(placed[i]===s.order[i]?"right":"wrong");});
    if(ok){ markDone(s,fb,s.explain); }
    else { fb.innerHTML=`<div class="feedback no"><strong>Noch nicht ganz.</strong> Die rot markierten Positionen stimmen noch nicht. Tipp: Klick einen Eintrag an, um ihn zu entfernen, und sortiere neu.</div>`;
      addRetry(s); document.getElementById("check").setAttribute("disabled",""); }
  };
}

/* ----- match ----- */
function buildMatch(s){
  const body=document.getElementById("qbody");
  const rows=shuffle(s.rows);
  const catOpts=shuffle(s.cats);
  body.innerHTML=rows.map(r=>`
    <div class="matchrow" data-k="${r.key}">
      <span class="ml">${r.left}</span>
      <select data-k="${r.key}">
        <option value="">&ndash; wählen &ndash;</option>
        ${catOpts.map(c=>`<option value="${c.key}">${c.label}</option>`).join("")}
      </select>
    </div>`).join("");
  document.getElementById("check").onclick=()=>{
    const sels=[...body.querySelectorAll("select")];
    if(sels.some(se=>!se.value)){flash("Bitte für jede Zeile eine Funktion wählen.");return;}
    let ok=true;
    sels.forEach(se=>{
      const r=s.rows.find(x=>x.key===se.dataset.k);
      const row=body.querySelector('.matchrow[data-k="'+r.key+'"]');
      row.classList.remove("right","wrong");
      if(se.value===r.cat){row.classList.add("right");} else {row.classList.add("wrong");ok=false;}
    });
    const fb=document.getElementById("fb");
    if(ok){ sels.forEach(se=>se.setAttribute("disabled","")); markDone(s,fb); }
    else { fb.innerHTML=`<div class="feedback no"><strong>Noch nicht ganz.</strong> Die rot markierten Zuordnungen stimmen noch nicht &ndash; korrigiere sie und prüfe erneut.</div>`; }
  };
}

/* ----- shared ----- */
function markDone(s,fb,extra){
  state[s.id]={done:true};
  updateProgress();
  let why="";
  if(s.qtype==="match"){ why='<div class="why">'+s.rows.map(r=>"<strong>"+r.left+":</strong> "+r.exp).join("<br>")+"</div>"; }
  else if(extra){ why='<div class="why">'+extra+"</div>"; }
  fb.innerHTML=`<div class="feedback ok"><strong>Richtig! \u2713</strong>${why}</div>`;
  document.getElementById("next").removeAttribute("disabled");
  document.getElementById("check").setAttribute("disabled","");
}
function addRetry(s){
  const fb=document.getElementById("fb");
  const b=document.createElement("button");
  b.className="check";b.style.marginTop="12px";b.textContent="Nochmal versuchen";
  b.onclick=()=>renderQuestion(s);
  fb.appendChild(b);
}
function flash(msg){
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="feedback no">${msg}</div>`;
}
function revealSolved(s){
  // if revisited after solving, just show a solved banner + Weiter active
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="feedback ok"><strong>Bereits gemeistert \u2713</strong> Du kannst weiter.</div>`;
  document.getElementById("check").setAttribute("disabled","");
  const qb=document.getElementById("qbody");
  qb.style.opacity=".55";qb.style.pointerEvents="none";
}

/* ----- reflect ----- */
function renderReflect(s){
  app.innerHTML=`<div class="card">
    <div class="qmeta">Transfer</div>
    <h2>Für deinen Unterricht</h2>
    <p class="lead">${s.intro}</p>
    ${s.questions.map((q,i)=>`<div class="reflq">${i+1}. ${q}</div><textarea data-i="${i}" placeholder="Deine Notiz …">${reflectAnswers[i]?reflectAnswers[i].replace(/"/g,'&quot;'):""}</textarea>`).join("")}
    <div class="row">
      <button class="ghost" id="back">Zurück</button>
      <div style="display:flex;gap:10px">
        <button class="ghost" id="copy">Notizen kopieren</button>
        <button class="btn" id="next">Zum Report</button>
      </div>
    </div>
  </div>`;
  app.querySelectorAll("textarea").forEach(t=>t.oninput=()=>reflectAnswers[+t.dataset.i]=t.value);
  document.getElementById("back").onclick=()=>go(cur-1);
  document.getElementById("next").onclick=()=>go(cur+1);
  document.getElementById("copy").onclick=()=>{
    const txt=s.questions.map((q,i)=>(i+1)+". "+q.replace(/<[^>]+>/g,"")+"\n"+(reflectAnswers[i]||"(noch leer)")).join("\n\n");
    navigator.clipboard.writeText(txt).then(()=>{document.getElementById("copy").textContent="Kopiert \u2713";},()=>{document.getElementById("copy").textContent="Kopieren ging nicht";});
  };
}

/* ----- report ----- */
function renderReport(){
  const qs=steps.filter(x=>x.type==="q");
  const rep=qs.map(s=>{
    let answers="";
    if(s.qtype==="single"||s.qtype==="multi"){
      answers=s.options.map(o=>`<div class="ans ${o.correct?"r":"x"}"><span class="lab">${o.correct?"\u2713 richtig:":"\u2717 falsch:"}</span> ${o.text} <span class="why">&ndash; ${o.exp}</span></div>`).join("");
    } else if(s.qtype==="order"){
      answers=`<div class="ans r"><span class="lab">Richtige Reihenfolge:</span> ${s.order.map(k=>s.items.find(it=>it.key===k).text).join(" \u2192 ")}</div><div class="ans"><span class="why">${s.explain}</span></div>`;
    } else if(s.qtype==="match"){
      answers=s.rows.map(r=>`<div class="ans r"><span class="lab">${r.left} \u2192 ${s.cats.find(c=>c.key===r.cat).label}</span> <span class="why">&ndash; ${r.exp}</span></div>`).join("");
    }
    return `<div class="report-q"><div class="rp">${s.id}. ${s.prompt}</div>${answers}</div>`;
  }).join("");
  app.innerHTML=`<div class="card">
    <div class="celebrate"><div class="big">100&nbsp;%</div><p class="lead">Alle Aufgaben gemeistert. Hier dein Feedback-Report &ndash; mit Begründung zu jeder Option.</p></div>
    <h2 style="margin-top:18px">Feedback-Report</h2>
    ${rep}
    <div class="row"><button class="ghost" id="back">Zurück</button><button class="btn" id="restart">Von vorn</button></div>
  </div>`;
  document.getElementById("back").onclick=()=>go(cur-1);
  document.getElementById("restart").onclick=()=>{for(const k in state)delete state[k];updateProgress();go(0);};
}

updateProgress();
render();
</script>
