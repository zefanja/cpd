  .mode-group {

    border-radius: 8px;
    overflow: hidden;
  }
  .mode-group button {
    border: none;
    background: var(--card-bg);
    padding: .45rem .9rem;
    font-size: .85rem;
    cursor: pointer;
    color: var(--text);
    border-right: 1px solid var(--border);

    background: var(--accent);
    color: #fff;

    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .85rem;
    min-width: 220px;
    flex: 1;

  .count {
    color: var(--muted);
    font-size: .8rem;
    margin-left: auto;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  h2.chapter-heading {
    font-size: 1rem;
    margin: 1.75rem 0 .75rem;
    padding-bottom: .35rem;
    border-bottom: 2px solid var(--accent);
    color: var(--accent);
  }
  h2.chapter-heading:first-child { margin-top: 0; }
  ul.video-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  li.video-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .7rem .9rem;
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .clip-num {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: .8rem;
    min-width: 2.4rem;
  }
  .video-info { flex: 1; min-width: 0; }
  .video-title {
    font-weight: 600;
    font-size: .92rem;
  }
  .video-title a {
    color: var(--text);
    text-decoration: none;
  }
  .video-title a:hover { color: var(--accent); }
  .chapter-tags {
    margin-top: .25rem;
    display: flex;
    flex-wrap: wrap;
    gap: .3rem;
  }
  .chapter-tags span {
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: .68rem;
    padding: .1rem .45rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .watch-btn {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: .4rem .8rem;
    border-radius: 7px;
    font-size: .8rem;
    font-weight: 600;
  }
  .watch-btn:hover { background: var(--accent-hover); }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 2rem;
  }
</style>

<script>
const data = JSON.parse(document.getElementById('video-data').textContent);
const chapterOrder = data.chapterOrder;
const videos = data.videos;

document.getElementById('total-count').textContent = `${videos.length} unique videos across ${chapterOrder.length} sections.`;

let mode = 'chapter';
let query = '';

function matchesQuery(v) {
  if (!query) return true;
  const q = query.toLowerCase();
  return v.title.toLowerCase().includes(q) ||
         v.chapters.some(c => c.toLowerCase().includes(q));
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const filtered = videos.filter(matchesQuery);
  document.getElementById('visible-count').textContent = `${filtered.length} shown`;

  if (filtered.length === 0) {
    main.innerHTML = '<p class="empty">No videos match your filter.</p>';
    return;
  }

  function shortChapterLabel(c) {
    const m = c.match(/^Chapter (\d+) - (.*)/);
    return m ? `Ch. ${m[1]}: ${m[2]}` : c;
  }

  function renderItem(v) {
    const li = document.createElement('li');
    li.className = 'video-item';
    li.innerHTML = `
      <span class="clip-num">#${v.clip}</span>
      <div class="video-info">
        <div class="video-title"><a href="${v.link}" target="_blank" rel="noopener">${v.title}</a></div>
        <div class="chapter-tags">${v.chapters.map(c => `<span>${shortChapterLabel(c)}</span>`).join('')}</div>
      </div>
      <a class="watch-btn" href="${v.link}" target="_blank" rel="noopener">Watch ▸</a>
    `;
    return li;
  }

  if (mode === 'chapter') {
    for (const chapter of chapterOrder) {
      const items = filtered.filter(v => v.chapters.includes(chapter));
      if (items.length === 0) continue;
      const h2 = document.createElement('h2');
      h2.className = 'chapter-heading';
      h2.textContent = `${chapter} (${items.length})`;
      main.appendChild(h2);
      const ul = document.createElement('ul');
      ul.className = 'video-list';
      items.sort((a, b) => a.clip - b.clip).forEach(v => ul.appendChild(renderItem(v)));
      main.appendChild(ul);
    }
  } else {
    const sorted = [...filtered];
    if (mode === 'alpha') {
      sorted.sort((a, b) => a.title.localeCompare(b.title));
    } else if (mode === 'clip') {
      sorted.sort((a, b) => a.clip - b.clip);
    }
    const ul = document.createElement('ul');
    ul.className = 'video-list';
    sorted.forEach(v => ul.appendChild(renderItem(v)));
    main.appendChild(ul);
  }
}

document.getElementById('mode-group').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  mode = btn.dataset.mode;
  document.querySelectorAll('#mode-group button').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value;
  render();
});

render();
</script>

</body>
</html>
