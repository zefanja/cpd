<script>
const videos = JSON.parse(document.getElementById('video-data').textContent);
const years = [...new Set(videos.map(v => v.year))].sort((a,b) => b.localeCompare(a));

const brokenCount = videos.filter(v => v.broken).length;
document.getElementById('total-count').textContent = `${videos.length} videos across ${new Set(videos.map(v=>v.postUrl)).size} posts, ${years[years.length-1]}–${years[0]}. ${brokenCount} flagged as possibly dead links (verified via Vimeo/YouTube oEmbed).`;

let mode = 'year';
let query = '';
let hideBroken = false;

function matchesQuery(v) {
  if (hideBroken && v.broken) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return v.title.toLowerCase().includes(q) ||
         (v.caption || '').toLowerCase().includes(q) ||
         v.platform.toLowerCase().includes(q);
}

function renderItem(v) {
  const li = document.createElement('li');
  li.className = 'video-item' + (v.broken ? ' broken' : '');
  li.innerHTML = `
    <span class="clip-num">${v.date}</span>
    <div class="video-info">
      <div class="video-title"><a href="${v.postUrl}" target="_blank" rel="noopener">${v.title}</a></div>
      ${v.caption ? `<div class="caption">${v.caption}</div>` : ''}
      <div class="chapter-tags">
        <span class="platform-${v.platform.replace(/[^A-Za-z]/g,'')}">${v.platform}</span>
        ${v.broken ? `<span class="broken-tag">⚠ link may be dead</span>` : ''}
      </div>
    </div>
    <div class="btn-group">
      <a class="watch-btn${v.broken ? ' broken' : ''}" href="${v.videoUrl}" target="_blank" rel="noopener">${v.broken ? 'Try video ▸' : 'Watch ▸'}</a>
      <a class="post-btn${v.broken ? ' emphasize' : ''}" href="${v.postUrl}" target="_blank" rel="noopener">Read post</a>
    </div>
  `;
  return li;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const filtered = videos.filter(matchesQuery);
  document.getElementById('visible-count').textContent = `${filtered.length} shown`;

  if (filtered.length === 0) {
    main.innerHTML = '<p class="empty">No videos match your filter.</p>';
    return;
  }

  if (mode === 'year') {
    for (const year of years) {
      const items = filtered.filter(v => v.year === year);
      if (items.length === 0) continue;
      const h2 = document.createElement('h2');
      h2.className = 'chapter-heading';
      h2.textContent = `${year} (${items.length})`;
      main.appendChild(h2);
      const ul = document.createElement('ul');
      ul.className = 'video-list';
      items.sort((a, b) => b.iso.localeCompare(a.iso)).forEach(v => ul.appendChild(renderItem(v)));
      main.appendChild(ul);
    }
  } else {
    const sorted = [...filtered];
    if (mode === 'alpha') {
      sorted.sort((a, b) => a.title.localeCompare(b.title));
    } else if (mode === 'newest') {
      sorted.sort((a, b) => b.iso.localeCompare(a.iso));
    }
    const ul = document.createElement('ul');
    ul.className = 'video-list';
    sorted.forEach(v => ul.appendChild(renderItem(v)));
    main.appendChild(ul);
  }
}

document.getElementById('mode-group').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  mode = btn.dataset.mode;
  document.querySelectorAll('#mode-group button').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value;
  render();
});

document.getElementById('hide-broken').addEventListener('change', (e) => {
  hideBroken = e.target.checked;
  render();
});

render();
</script>
